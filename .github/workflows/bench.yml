# Cost: about 267 runner-min/day (241-319) for the run every push to main starts.
# Run shape: the full corpus, the lane's only run. A plan job and one job per corpus entry
# (three repo projects and the enterprise fixture) bench the pushed commit against its
# first parent. Side A is HEAD^1, not the lane's last green commit: the corpus is a fixed
# workload and only the engine differs between the sides, so an older base selects no
# smaller workload and would credit several pushes' speed change to one commit.
# Per run: 15.3-20.3 job-min (median 17.0), summed job wall times of the seven dispatch runs
# of this design. Run 38297580066 took 20.3; runs 38279943505, 38144176368, 38143012318,
# 38140987766, 38138985254 and 38135504932 took 15.3-17.7. There is no push run yet.
# Rate: 110 first-parent commits on main, 2026-10-06T01:54Z to 2026-10-13T01:54Z, so
# 15.71 pushes/day. This public repo runs on standard runners: occupancy, billed at 0.
# PR CI: a push holds at most 4 runners at once, 3.7-7.7 min each. That week, jobs with no
# `needs` started within a 2 s median below 40 concurrent jobs and queued a median 33-224 s
# at 40-69, so Bench delays PR CI only while the pool already holds about 40 jobs. A replay
# of the week, dropping the pull_request Bench (500.7 runner-min/day) and adding these runs
# unqueued, lowers the hours at 40+ concurrent jobs from 11.98 to 11.45.
name: Bench

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: bench-${{ github.event_name == 'push' && github.sha || github.run_id }}
  cancel-in-progress: false

jobs:
  plan:
    name: bench · side A and the legs
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      base: ${{ steps.plan.outputs.base }}
      targets: ${{ steps.targets.outputs.targets }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Released tarballs
        uses: ./.github/actions/released-tarballs
      - name: Install the bench harness
        run: pnpm install --frozen-lockfile

      - id: plan
        name: Side A and the legs
        env:
          GH_TOKEN: ${{ github.token }}
        run: pnpm --filter @systemfsoftware/stryker-bench plan
      - id: targets
        name: One target per leg
        env:
          LEGS: ${{ steps.plan.outputs.legs }}
        run: |
          targets=$(jq -c 'map({ entry: ., slug: gsub("[^A-Za-z0-9._-]+"; "-") })' <<< "$LEGS")
          echo "targets=$targets" >> "$GITHUB_OUTPUT"

  bench:
    name: bench · ${{ matrix.target.entry }}
    needs: plan
    if: ${{ needs.plan.outputs.targets != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.plan.outputs.targets) }}
    env:
      CI: "true"
    steps:
      - name: Record the job start
        run: echo "JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - id: sides
        name: Both sides as sibling worktrees
        env:
          BASE: ${{ needs.plan.outputs.base }}
        run: |
          side_a="$RUNNER_TEMP/bench-a"
          side_b="$RUNNER_TEMP/bench-b"
          git worktree add --detach "$side_a" "$BASE"
          git worktree add --detach "$side_b" HEAD
          pin() { jq -c '.nodes["stryker-published"].locked' "$1/flake.lock"; }
          {
            echo "a=$side_a"
            echo "b=$side_b"
            echo "same-pin=$([ "$(pin "$side_a")" = "$(pin .)" ] && echo true || echo false)"
          } >> "$GITHUB_OUTPUT"

      - name: Released tarballs, side B
        uses: ./.github/actions/released-tarballs
      - if: steps.sides.outputs.same-pin != 'true'
        uses: cachix/install-nix-action@v31

      - name: Tarballs and install, both sides by one mechanism
        env:
          SIDE_A: ${{ steps.sides.outputs.a }}
          SIDE_B: ${{ steps.sides.outputs.b }}
          SAME_PIN: ${{ steps.sides.outputs.same-pin }}
          TIMINGS: ${{ runner.temp }}/bench-setup.tsv
        run: |
          started=$(date +%s%3N)
          rm -rf "$SIDE_A/.sfs-deps"
          if [ "$SAME_PIN" = true ]; then
            cp -r .sfs-deps "$SIDE_A/.sfs-deps"
          else
            published=$(cd "$SIDE_A" && nix build --no-link --print-out-paths .#stryker-published)
            mkdir "$SIDE_A/.sfs-deps"
            cp "$published"/*.tgz "$SIDE_A/.sfs-deps/"
            chmod u+w "$SIDE_A"/.sfs-deps/*.tgz
          fi
          printf 'side A: released tarballs\t%s\n' "$(($(date +%s%3N) - started))" >> "$TIMINGS"
          started=$(date +%s%3N)
          rm -rf "$SIDE_B/.sfs-deps"
          cp -r .sfs-deps "$SIDE_B/.sfs-deps"
          printf 'side B: released tarballs\t%s\n' "$(($(date +%s%3N) - started))" >> "$TIMINGS"
          install() {
            local name=$1 root=$2 started
            started=$(date +%s%3N)
            (cd "$root" && pnpm install --frozen-lockfile)
            printf 'side %s: pnpm install\t%s\n' "$name" "$(($(date +%s%3N) - started))" >> "$TIMINGS"
          }
          install A "$SIDE_A"
          install B "$SIDE_B"

      - name: Install the bench harness in the checkout
        env:
          TIMINGS: ${{ runner.temp }}/bench-setup.tsv
        run: |
          started=$(date +%s%3N)
          pnpm install --frozen-lockfile
          printf 'checkout: harness pnpm install\t%s\n' "$(($(date +%s%3N) - started))" >> "$TIMINGS"

      - name: Turbo cache
        uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-bench-${{ matrix.target.slug }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-bench-${{ matrix.target.slug }}-
            turbo-${{ runner.os }}-dist-

      - name: Bench
        env:
          BENCH_ENTRY: ${{ matrix.target.entry }}
          BENCH_SIDE_A: ${{ steps.sides.outputs.a }}
          BENCH_SIDE_B: ${{ steps.sides.outputs.b }}
          BENCH_TURBO_CACHE_DIR: ${{ github.workspace }}/.turbo/cache
          BENCH_BASE_SHA: ${{ needs.plan.outputs.base }}
          BENCH_HEAD_SHA: ${{ github.sha }}
          BENCH_REF: ${{ github.ref }}
          BENCH_SETUP_TIMINGS: ${{ runner.temp }}/bench-setup.tsv
        run: pnpm --filter @systemfsoftware/stryker-bench bench

      - name: Bench report artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: bench-report-${{ matrix.target.slug }}
          path: ${{ runner.temp }}/bench-report/bench-report.json
          if-no-files-found: warn
          retention-days: 30

      - name: Bench run streams artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: bench-runs-${{ matrix.target.slug }}
          path: ${{ runner.temp }}/bench-runs/
          if-no-files-found: warn
          retention-days: 7
