name: Bench

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bench-${{ github.sha }}
  cancel-in-progress: false

jobs:
  plan:
    name: bench · one job per corpus entry
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      targets: ${{ steps.targets.outputs.targets }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          sparse-checkout: test/bench/corpus.json
          sparse-checkout-cone-mode: false
      - id: targets
        name: Corpus entries
        run: |
          targets=$(jq -c '[.repo[].project, .enterprise.fixture] | map({ entry: ., slug: gsub("[^A-Za-z0-9._-]+"; "-") })' test/bench/corpus.json)
          echo "targets=$targets" >> "$GITHUB_OUTPUT"

  bench:
    name: bench · ${{ matrix.target.entry }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.plan.outputs.targets) }}
    env:
      CI: "true"
    steps:
      - name: Record the job start
        run: echo "JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - id: sides
        name: Both sides as sibling worktrees
        run: |
          parent=$(git rev-parse HEAD^1)
          side_a="$RUNNER_TEMP/bench-a"
          side_b="$RUNNER_TEMP/bench-b"
          git worktree add --detach "$side_a" "$parent"
          git worktree add --detach "$side_b" HEAD
          pin() { jq -c '.nodes["stryker-published"].locked' "$1/flake.lock"; }
          {
            echo "parent=$parent"
            echo "a=$side_a"
            echo "b=$side_b"
            echo "same-pin=$([ "$(pin "$side_a")" = "$(pin .)" ] && echo true || echo false)"
          } >> "$GITHUB_OUTPUT"

      - name: Released tarballs, side B
        uses: ./.github/actions/released-tarballs
      - if: steps.sides.outputs.same-pin != 'true'
        uses: cachix/install-nix-action@v31

      - name: Tarballs and install, both sides by one mechanism
        env:
          SIDE_A: ${{ steps.sides.outputs.a }}
          SIDE_B: ${{ steps.sides.outputs.b }}
          SAME_PIN: ${{ steps.sides.outputs.same-pin }}
          TIMINGS: ${{ runner.temp }}/bench-setup.tsv
        run: |
          started=$(date +%s%3N)
          rm -rf "$SIDE_A/.sfs-deps"
          if [ "$SAME_PIN" = true ]; then
            cp -r .sfs-deps "$SIDE_A/.sfs-deps"
          else
            published=$(cd "$SIDE_A" && nix build --no-link --print-out-paths .#stryker-published)
            mkdir "$SIDE_A/.sfs-deps"
            cp "$published"/*.tgz "$SIDE_A/.sfs-deps/"
            chmod u+w "$SIDE_A"/.sfs-deps/*.tgz
          fi
          printf 'side A: released tarballs\t%s\n' "$(($(date +%s%3N) - started))" >> "$TIMINGS"
          started=$(date +%s%3N)
          rm -rf "$SIDE_B/.sfs-deps"
          cp -r .sfs-deps "$SIDE_B/.sfs-deps"
          printf 'side B: released tarballs\t%s\n' "$(($(date +%s%3N) - started))" >> "$TIMINGS"
          install() {
            local name=$1 root=$2 started
            started=$(date +%s%3N)
            (cd "$root" && pnpm install --frozen-lockfile)
            printf 'side %s: pnpm install\t%s\n' "$name" "$(($(date +%s%3N) - started))" >> "$TIMINGS"
          }
          install A "$SIDE_A"
          install B "$SIDE_B"

      - name: Install the bench harness in the checkout
        run: pnpm install --frozen-lockfile

      - name: Turbo cache
        uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-bench-${{ matrix.target.slug }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-bench-${{ matrix.target.slug }}-
            turbo-${{ runner.os }}-dist-

      - name: Bench
        env:
          BENCH_ENTRY: ${{ matrix.target.entry }}
          BENCH_SIDE_A: ${{ steps.sides.outputs.a }}
          BENCH_SIDE_B: ${{ steps.sides.outputs.b }}
          BENCH_TURBO_CACHE_DIR: ${{ github.workspace }}/.turbo/cache
          BENCH_BASE_SHA: ${{ steps.sides.outputs.parent }}
          BENCH_HEAD_SHA: ${{ github.sha }}
          BENCH_REF: ${{ github.ref }}
          BENCH_SETUP_TIMINGS: ${{ runner.temp }}/bench-setup.tsv
        run: pnpm --filter @systemfsoftware/stryker-bench bench

      - name: Bench report artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: bench-report-${{ matrix.target.slug }}
          path: ${{ runner.temp }}/bench-report/bench-report.json
          if-no-files-found: warn
          retention-days: 30

      - name: Bench run streams artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: bench-runs-${{ matrix.target.slug }}
          path: ${{ runner.temp }}/bench-runs/
          if-no-files-found: warn
          retention-days: 7
