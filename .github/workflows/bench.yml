name: Bench

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bench:
    name: bench · phase timings against the base
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: cachix/install-nix-action@v31
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - id: sides
        name: Side A at the merge-base with the base branch
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags origin "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"
          base=$(git merge-base HEAD "origin/$BASE_REF")
          side_a="$RUNNER_TEMP/bench-a"
          git worktree add --detach "$side_a" "$base"
          pin_key() {
            jq -er '.nodes["stryker-published"].locked | "\(.rev)-\(.narHash)"' "$1/flake.lock" | sha256sum | cut -c1-64
          }
          {
            echo "base=$base"
            echo "a=$side_a"
            echo "key-a=bench-sfs-deps-$RUNNER_OS-$(pin_key "$side_a")"
            echo "key-b=bench-sfs-deps-$RUNNER_OS-$(pin_key .)"
          } >> "$GITHUB_OUTPUT"

      - name: Released tarballs, side A
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/bench-tarballs/a
          key: ${{ steps.sides.outputs.key-a }}
      - name: Released tarballs, side B
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/bench-tarballs/b
          key: ${{ steps.sides.outputs.key-b }}

      - name: Tarballs and install, both sides by one mechanism
        env:
          SIDE_A: ${{ steps.sides.outputs.a }}
          TIMINGS: ${{ runner.temp }}/bench-setup.tsv
        run: |
          prepare() {
            local name=$1 root=$2 tarballs=$3 started published
            started=$(date +%s%3N)
            if ! compgen -G "$tarballs/*.tgz" > /dev/null; then
              published=$(cd "$root" && nix build --no-link --print-out-paths .#stryker-published)
              mkdir -p "$tarballs"
              cp "$published"/*.tgz "$tarballs/"
              chmod u+w "$tarballs"/*.tgz
            fi
            rm -rf "$root/.sfs-deps"
            mkdir "$root/.sfs-deps"
            cp "$tarballs"/*.tgz "$root/.sfs-deps/"
            (cd "$root" && pnpm install --frozen-lockfile)
            printf 'side %s: released tarballs and install\t%s\n' "$name" "$(($(date +%s%3N) - started))" >> "$TIMINGS"
          }
          prepare A "$SIDE_A" "$RUNNER_TEMP/bench-tarballs/a"
          prepare B "$GITHUB_WORKSPACE" "$RUNNER_TEMP/bench-tarballs/b"

      - name: Turbo cache
        uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-bench-${{ github.event.pull_request.head.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-bench-
            turbo-${{ runner.os }}-dist-

      - name: Bench
        env:
          BENCH_SIDE_A: ${{ steps.sides.outputs.a }}
          BENCH_SIDE_B: ${{ github.workspace }}
          BENCH_BASE_SHA: ${{ steps.sides.outputs.base }}
          BENCH_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BENCH_SETUP_TIMINGS: ${{ runner.temp }}/bench-setup.tsv
        run: pnpm --filter @systemfsoftware/stryker-bench bench

      - name: Bench report artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: bench-report
          path: ${{ runner.temp }}/bench-report/bench-report.json
          if-no-files-found: warn
          retention-days: 30
