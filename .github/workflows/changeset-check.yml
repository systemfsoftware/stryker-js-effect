# Thin caller of the shared changeset check in
# systemfsoftware/pnpm-release-management. The reusable fails a pull request that
# touches a publishable package without an intent naming it; this caller only
# supplies the trigger and pins the toolchain revision via tools-ref
name: Changeset Check

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  check:
    uses: systemfsoftware/pnpm-release-management/.github/workflows/changeset-check.yml@main
    with:
      tools-ref: main
