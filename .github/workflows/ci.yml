name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    if: github.event_name != 'push' || github.event.head_commit.author.username != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: "true"
      OXLINT_FORMAT: github
      TSGO_FORMAT: github-actions
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - name: dprint from the flake
        run: echo "$(nix build --no-link --print-out-paths .#dprint)/bin" >> "$GITHUB_PATH"
      - uses: ./.github/actions/released-tarballs
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Turbo cache
        uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-dist-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-dist-
            turbo-${{ runner.os }}-
      - name: Commit graph of main for repo-checks
        run: |
          unshallow=$([ "$(git rev-parse --is-shallow-repository)" = true ] && echo --unshallow || true)
          git fetch --no-tags --filter=tree:0 $unshallow origin +refs/heads/main:refs/remotes/origin/main
      - name: pnpm gate:repo fails on a change that adds two plans
        run: |
          planted=$(
            export GIT_INDEX_FILE="$RUNNER_TEMP/planted.index"
            git read-tree HEAD
            for name in planted-a planted-b; do
              blob=$(printf '# %s\n' "$name" | git hash-object -w --stdin)
              git update-index --add --cacheinfo "100644,$blob,docs/plans/$name-plan.md"
            done
            git -c user.name=plant -c user.email=plant@localhost commit-tree "$(git write-tree)" -p HEAD -m 'plant: two plans'
          )
          status=0
          pnpm gate:repo --head "$planted" || status=$?
          test "$status" -eq 1 || { echo "::error::pnpm gate:repo must exit 1 on two planted plans, got $status" >&2; exit 1; }
      # Root package.json `check:ci` is the one definition. Never re-enumerate its steps here.
      - name: Gate
        run: pnpm check:ci

  e2e:
    if: github.event_name != 'push' || github.event.head_commit.author.username != 'github-actions[bot]'
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: lifecycle
            files: tests/enterprise-mutation-lifecycle.e2e.test.ts
          - shard: sabotage
            files: tests/enterprise-monorepo-sabotage.e2e.test.ts
          - shard: svelte-composite
            files: tests/svelte-app.e2e.test.ts tests/enterprise-composite-checker.e2e.test.ts
          - shard: rest-1
            files: --shard=1/2
          - shard: rest-2
            files: --shard=2/2
    name: e2e (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true"
      RUNTIME: docker
      OTEL_ENABLED: "true"
      OTEL_SERVICE_NAME: stryker-js-ci
      OTEL_EXPORTER_OTLP_ENDPOINT: http://127.0.0.1:4318
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: cachix/install-nix-action@v31
      - uses: ./.github/actions/released-tarballs
      - run: pnpm install --frozen-lockfile
      - name: deno from the flake
        run: echo "$(nix build --no-link --print-out-paths .#deno)/bin" >> "$GITHUB_PATH"
      - name: Install process-compose (pinned)
        run: |
          curl -sSfL -o /tmp/pc.tar.gz https://github.com/F1bonacc1/process-compose/releases/download/v1.122.0/process-compose_linux_amd64.tar.gz
          echo '9b6dbc38324c0b0481f1cd1dd828ffdc78117129ec797678f4bf8c4023311281  /tmp/pc.tar.gz' | sha256sum -c -
          sudo tar xzf /tmp/pc.tar.gz -C /usr/local/bin process-compose
      - name: Start LGTM (blocks until probe-ready)
        run: |
          echo "TRACE_WINDOW_START=$(date +%s)" >> "$GITHUB_ENV"
          pnpm lgtm:up
      # `timeout` converts a hang into a STEP failure. A job-level timeout
      # cancels the job, and cancelled jobs skip `if: always()` steps — which
      # would suppress the telemetry artifact on exactly the hang scenario it
      # exists for.
      - name: E2E lane
        run: >-
          timeout --signal=TERM --kill-after=10s 1200 pnpm test:e2e -- ${{ matrix.files }}
          ${{ startsWith(matrix.shard, 'rest') && '--exclude=tests/enterprise-mutation-lifecycle.e2e.test.ts --exclude=tests/enterprise-monorepo-sabotage.e2e.test.ts --exclude=tests/svelte-app.e2e.test.ts --exclude=tests/enterprise-composite-checker.e2e.test.ts' || '' }}
      - name: Export telemetry
        if: always()
        run: ./test/e2e/scripts/export-traces.ts
      - name: Container logs on failure
        if: failure()
        continue-on-error: true
        run: |
          mkdir -p e2e-telemetry/containers
          for c in $(docker ps -aq); do
            name=$(docker inspect --format '{{.Name}}' "$c" | sed 's|^/||')
            docker logs "$c" > "e2e-telemetry/containers/${name}.log" 2>&1 || true
          done
      - name: Package telemetry
        if: always()
        run: tar czf e2e-telemetry.tar.gz e2e-telemetry
      - name: Upload telemetry artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-telemetry-${{ github.run_id }}-${{ matrix.shard }}
          path: e2e-telemetry.tar.gz
          retention-days: 7
          if-no-files-found: error

  checker-parity-changes:
    if: github.event_name != 'push' || github.event.head_commit.author.username != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      run: ${{ steps.changes.outputs.run }}
      base: ${{ steps.changes.outputs.base }}
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: base
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = push ]; then
            base="$BEFORE"
            git cat-file -e "$base^{commit}" 2>/dev/null || base=$(git rev-parse HEAD^1)
          else
            git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
            base=$(git merge-base HEAD origin/main)
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: cachix/install-nix-action@v31
      - uses: ./.github/actions/released-tarballs
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo build --filter @systemfsoftware/stryker-checker-parity
      - id: changes
        env:
          BASE: ${{ steps.base.outputs.base }}
        run: |
          node test/checker-parity/dist/main.mjs trigger --base "$BASE" | tee -a "$GITHUB_OUTPUT"
          echo "base=$BASE" >> "$GITHUB_OUTPUT"

  checker-parity:
    needs: checker-parity-changes
    if: needs.checker-parity-changes.outputs.run == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: 1
          - shard: 2
          - shard: 3
          - shard: 4
          - shard: 5
          - shard: 6
    name: checker-parity (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: "true"
      SHARDS: 6
      BASE: ${{ needs.checker-parity-changes.outputs.base }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: cachix/install-nix-action@v31
      - uses: ./.github/actions/released-tarballs
      - run: pnpm install --frozen-lockfile
      - name: Build the branch checker, instrumenter and driver
        run: >-
          pnpm turbo build
          --filter @systemfsoftware/stryker-js-typescript-checker
          --filter @systemfsoftware/stryker-checker-parity
      - name: Build main's checker at the base commit
        run: |
          git worktree add "$RUNNER_TEMP/main-side" "$BASE"
          cd "$RUNNER_TEMP/main-side"
          if cmp -s flake.lock "$GITHUB_WORKSPACE/flake.lock"; then
            cp -r "$GITHUB_WORKSPACE/.sfs-deps" .sfs-deps
          else
            mkdir .sfs-deps
            cp "$(nix build --no-link --print-out-paths .#stryker-published)"/*.tgz .sfs-deps/
            chmod u+w .sfs-deps/*.tgz
          fi
          pnpm install --frozen-lockfile
          pnpm turbo build --filter @systemfsoftware/stryker-js-typescript-checker
      - name: Restore verdict cache
        if: github.event_name != 'push'
        uses: actions/cache/restore@v6
        with:
          path: .checker-parity-cache
          key: checker-parity-${{ matrix.shard }}-${{ github.run_id }}
          restore-keys: checker-parity-${{ matrix.shard }}-
      - name: Run both checkers over the shard
        run: >-
          timeout --signal=TERM --kill-after=10s 2400
          node test/checker-parity/dist/main.mjs run
          --main-worker "$RUNNER_TEMP/main-side/packages/stryker-js-typescript-checker/dist/main.mjs"
          --branch-worker "$GITHUB_WORKSPACE/packages/stryker-js-typescript-checker/dist/main.mjs"
          --shard "${{ matrix.shard }}/$SHARDS"
          --cache .checker-parity-cache
          --out checker-parity-out
      - name: Point a failed shard at its artifact
        if: failure()
        env:
          SHARD: ${{ matrix.shard }}
          ARTIFACT: checker-parity-${{ github.run_id }}-${{ matrix.shard }}
        run: |
          echo "::error title=checker-parity shard $SHARD failed::Read artifact $ARTIFACT, file shard-$SHARD.ndjson (lines with _tag ProjectBootFailed or TelemetryMissing name the project; next action: rerun that project's worker with the reason shown)."
          {
            echo "### checker-parity shard $SHARD failed"
            echo "Artifact \`$ARTIFACT\`, file \`shard-$SHARD.ndjson\`."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Save verdict cache
        if: success()
        uses: actions/cache/save@v6
        with:
          path: .checker-parity-cache
          key: checker-parity-${{ matrix.shard }}-${{ github.run_id }}
      - name: Upload shard results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: checker-parity-${{ github.run_id }}-${{ matrix.shard }}
          path: checker-parity-out
          retention-days: 14
          if-no-files-found: error

  checker-parity-report:
    needs: [checker-parity-changes, checker-parity]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: "true"
    steps:
      - name: Change detection finished
        if: contains(fromJSON('["failure", "cancelled"]'), needs.checker-parity-changes.result)
        env:
          RESULT: ${{ needs.checker-parity-changes.result }}
        run: |
          echo "::error title=checker-parity change detection ${RESULT}::The checker-parity-changes job ended with ${RESULT}, so no shard ran (code shard-incomplete). Read that job's log, then rerun the workflow."
          echo "### checker-parity: change detection ended with \`$RESULT\`" >> "$GITHUB_STEP_SUMMARY"
          exit 1
      - name: Nothing to check
        if: needs.checker-parity-changes.outputs.run != 'true'
        run: echo "No change reaches the checker-parity corpus."
      - name: Every shard finished
        if: needs.checker-parity-changes.outputs.run == 'true' && needs.checker-parity.result != 'success'
        env:
          RESULT: ${{ needs.checker-parity.result }}
          PATTERN: checker-parity-${{ github.run_id }}-*
        run: |
          echo "::error title=checker-parity shards ${RESULT}::A shard did not finish (code shard-incomplete). Read the failed checker-parity (k) leg's annotation, then artifact ${PATTERN}, file shard-<k>.ndjson."
          {
            echo "### checker-parity: shards ended with \`$RESULT\`"
            echo "Reason code \`shard-incomplete\`. Artifacts \`$PATTERN\`, file \`shard-<k>.ndjson\` per shard."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1
      - uses: actions/checkout@v7
        if: needs.checker-parity-changes.outputs.run == 'true'
      - uses: pnpm/action-setup@v6
        if: needs.checker-parity-changes.outputs.run == 'true'
      - uses: actions/setup-node@v7
        if: needs.checker-parity-changes.outputs.run == 'true'
        with:
          node-version: 24
          cache: pnpm
      - uses: cachix/install-nix-action@v31
        if: needs.checker-parity-changes.outputs.run == 'true'
      - uses: ./.github/actions/released-tarballs
        if: needs.checker-parity-changes.outputs.run == 'true'
      - if: needs.checker-parity-changes.outputs.run == 'true'
        run: pnpm install --frozen-lockfile
      - if: needs.checker-parity-changes.outputs.run == 'true'
        run: pnpm turbo build --filter @systemfsoftware/stryker-checker-parity
      - uses: actions/download-artifact@v7
        if: needs.checker-parity-changes.outputs.run == 'true'
        with:
          pattern: checker-parity-${{ github.run_id }}-*
          path: checker-parity-shards
      - name: Compare main and branch verdicts
        if: needs.checker-parity-changes.outputs.run == 'true'
        run: >-
          node test/checker-parity/dist/main.mjs compare
          --shards 6
          --summary checker-parity-summary.json
          checker-parity-shards
      - name: Upload summary
        if: always() && needs.checker-parity-changes.outputs.run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: checker-parity-summary-${{ github.run_id }}
          path: checker-parity-summary.json
          retention-days: 14
          if-no-files-found: warn
