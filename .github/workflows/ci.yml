name: CI

# One job, from the organization's shared CI workflow. A pull request runs `pnpm check:ci`, the checks of what it
# affects; a push to main runs `pnpm check:full`, every check of every package. The squash-message lint and the
# change-intent check are steps of the same job. A failing check prints the command that reproduces it locally.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    uses: systemfsoftware/systemfsoftware/.github/workflows/reusable-ci.yml@7544b79a7f94d783ba7832bc7b07a413d5c60793
    with:
      commitlint: true
      changeset: true
      timeout-minutes: 60
      fast: TURBO_SCM_BASE="$BASE" TURBO_SCM_HEAD="$HEAD" pnpm check:ci
      full: pnpm check:full
