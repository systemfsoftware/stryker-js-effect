name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lane:
    if: github.event_name != 'push' || github.event.head_commit.author.username != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      docs-only: ${{ steps.lane.outputs.docs-only }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - id: lane
        uses: ./.github/actions/change-lane
      # A docs-only change skips `check`, so the two gates that read docs run here, from the
      # same package.json scripts, without an install.
      - if: steps.lane.outputs.docs-only == 'true'
        uses: cachix/install-nix-action@v31
      - if: steps.lane.outputs.docs-only == 'true'
        uses: pnpm/action-setup@v6
      - if: steps.lane.outputs.docs-only == 'true'
        name: Commit graph of main for repo-checks
        run: |
          unshallow=$([ "$(git rev-parse --is-shallow-repository)" = true ] && echo --unshallow || true)
          git fetch --no-tags --filter=tree:0 $unshallow origin +refs/heads/main:refs/remotes/origin/main
      - if: steps.lane.outputs.docs-only == 'true'
        name: Docs gates (format, single plan)
        run: |
          s=0
          pnpm --config.verify-deps-before-run=false format:check || s=1
          pnpm --config.verify-deps-before-run=false gate:repo || s=1
          exit $s

  check:
    needs: lane
    if: needs.lane.outputs.docs-only != 'true' && (github.event_name != 'push' || github.event.head_commit.author.username != 'github-actions[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: "true"
      OXLINT_FORMAT: github
      TSGO_FORMAT: github-actions
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - name: dprint from the flake
        run: echo "$(nix build --no-link --print-out-paths .#dprint)/bin" >> "$GITHUB_PATH"
      - uses: ./.github/actions/released-tarballs
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Turbo cache
        uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-dist-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-dist-
            turbo-${{ runner.os }}-
      - name: Commit graph of main for repo-checks
        run: |
          unshallow=$([ "$(git rev-parse --is-shallow-repository)" = true ] && echo --unshallow || true)
          git fetch --no-tags --filter=tree:0 $unshallow origin +refs/heads/main:refs/remotes/origin/main
      - name: pnpm gate:repo fails on a change that adds two plans
        run: |
          planted=$(
            export GIT_INDEX_FILE="$RUNNER_TEMP/planted.index"
            git read-tree HEAD
            for name in planted-a planted-b; do
              blob=$(printf '# %s\n' "$name" | git hash-object -w --stdin)
              git update-index --add --cacheinfo "100644,$blob,docs/plans/$name-plan.md"
            done
            git -c user.name=plant -c user.email=plant@localhost commit-tree "$(git write-tree)" -p HEAD -m 'plant: two plans'
          )
          status=0
          pnpm gate:repo --head "$planted" || status=$?
          test "$status" -eq 1 || { echo "::error::pnpm gate:repo must exit 1 on two planted plans, got $status" >&2; exit 1; }
      - name: Repo scripts tests
        run: ./bin/deno test --config=scripts/deno.json scripts/
      # Root package.json `check:ci` is the one definition. Never re-enumerate its steps here.
      - name: Gate
        run: pnpm check:ci

  e2e:
    needs: lane
    if: needs.lane.outputs.docs-only != 'true' && (github.event_name != 'push' || github.event.head_commit.author.username != 'github-actions[bot]')
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: lifecycle
            files: tests/enterprise-mutation-lifecycle.e2e.test.ts
          - shard: sabotage
            files: tests/enterprise-monorepo-sabotage.e2e.test.ts
          - shard: svelte-composite
            files: tests/svelte-app.e2e.test.ts tests/enterprise-composite-checker.e2e.test.ts
          - shard: rest-1
            files: --shard=1/2
          - shard: rest-2
            files: --shard=2/2
    name: e2e (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true"
      RUNTIME: docker
      OTEL_ENABLED: "true"
      OTEL_SERVICE_NAME: stryker-js-ci
      OTEL_EXPORTER_OTLP_ENDPOINT: http://127.0.0.1:4318
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: cachix/install-nix-action@v31
      - uses: ./.github/actions/released-tarballs
      - run: pnpm install --frozen-lockfile
      # The newest bake entry this ref can read. Global setup reuses its root only when
      # the packs key matches, and prunes it otherwise.
      - name: Restore the fixture bake
        id: restore-bake
        uses: actions/cache/restore@v6
        with:
          path: test/e2e/node_modules/.cache/stryker-e2e/baked
          key: e2e-bake-${{ runner.os }}-${{ github.sha }}
          restore-keys: e2e-bake-${{ runner.os }}-
      - name: deno from the flake
        run: echo "$(nix build --no-link --print-out-paths .#deno)/bin" >> "$GITHUB_PATH"
      - name: Install process-compose (pinned)
        run: |
          curl -sSfL -o /tmp/pc.tar.gz https://github.com/F1bonacc1/process-compose/releases/download/v1.122.0/process-compose_linux_amd64.tar.gz
          echo '9b6dbc38324c0b0481f1cd1dd828ffdc78117129ec797678f4bf8c4023311281  /tmp/pc.tar.gz' | sha256sum -c -
          sudo tar xzf /tmp/pc.tar.gz -C /usr/local/bin process-compose
      - name: Start LGTM (blocks until probe-ready)
        run: |
          echo "TRACE_WINDOW_START=$(date +%s)" >> "$GITHUB_ENV"
          pnpm lgtm:up
      # `timeout` converts a hang into a STEP failure. A job-level timeout
      # cancels the job, and cancelled jobs skip `if: always()` steps — which
      # would suppress the telemetry artifact on exactly the hang scenario it
      # exists for.
      - name: E2E lane
        id: lane
        env:
          STRYKER_E2E_BAKE_RECORD: ${{ runner.temp }}/e2e-bake.json
        run: >-
          timeout --signal=TERM --kill-after=10s 1200 pnpm test:e2e -- ${{ matrix.files }}
          ${{ startsWith(matrix.shard, 'rest') && '--exclude=tests/enterprise-mutation-lifecycle.e2e.test.ts --exclude=tests/enterprise-monorepo-sabotage.e2e.test.ts --exclude=tests/svelte-app.e2e.test.ts --exclude=tests/enterprise-composite-checker.e2e.test.ts' || '' }}
      - name: Bake report
        id: bake
        if: always()
        env:
          RECORD: ${{ runner.temp }}/e2e-bake.json
          LANE: ${{ steps.lane.outcome }}
          RESTORED: ${{ steps.restore-bake.outputs.cache-matched-key }}
        run: |
          if [ -f "$RECORD" ]; then
            jq -r .summary "$RECORD" >> "$GITHUB_STEP_SUMMARY"
            echo "Restored bake entry: \`${RESTORED:-none}\`." >> "$GITHUB_STEP_SUMMARY"
            jq -r '.annotations[]' "$RECORD"
            jq -r '"packs-key=\(.packsKey)", "baked=\(.baked)"' "$RECORD" >> "$GITHUB_OUTPUT"
          elif [ "$LANE" != success ]; then
            printf '### Fixture bake\n\n`E2E_BAKE_NO_RECORD`: the lane ended (%s) before global setup recorded the bake.\n' "$LANE" >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=E2E_BAKE_NO_RECORD::The E2E lane ended ($LANE) before global setup recorded the fixture bake. Next: read the global setup error in the E2E lane log; the e2e-telemetry artifact holds the e2e.setup spans."
          fi
      # One leg saves, and only when it baked something, so each packs key is uploaded once.
      - name: Save the fixture bake
        if: always() && matrix.shard == 'lifecycle' && steps.bake.outputs.packs-key != '' && steps.bake.outputs.baked != '0'
        uses: actions/cache/save@v6
        with:
          path: test/e2e/node_modules/.cache/stryker-e2e/baked
          key: e2e-bake-${{ runner.os }}-${{ steps.bake.outputs.packs-key }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Export telemetry
        if: always()
        run: ./test/e2e/scripts/export-traces.ts
      - name: Container logs on failure
        if: failure()
        continue-on-error: true
        run: |
          mkdir -p e2e-telemetry/containers
          for c in $(docker ps -aq); do
            name=$(docker inspect --format '{{.Name}}' "$c" | sed 's|^/||')
            docker logs "$c" > "e2e-telemetry/containers/${name}.log" 2>&1 || true
          done
      - name: Package telemetry
        if: always()
        run: tar czf e2e-telemetry.tar.gz e2e-telemetry
      - name: Upload telemetry artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-telemetry-${{ github.run_id }}-${{ matrix.shard }}
          path: e2e-telemetry.tar.gz
          retention-days: 7
          if-no-files-found: error
