name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      cache:
        description: "`cold` restores no Turbo cache in `check`, to measure a cold Gate."
        type: choice
        options: [warm, cold]
        default: warm

permissions:
  contents: read

env:
  PARITY_DEADLINE: "2160"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lane:
    if: github.event_name != 'push' || github.event.head_commit.author.username != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      docs-only: ${{ steps.lane.outputs.docs-only }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - id: lane
        uses: ./.github/actions/change-lane
      # A docs-only change skips `check`, so the two gates that read docs run here, from the
      # same package.json scripts, without an install.
      - if: steps.lane.outputs.docs-only == 'true'
        uses: cachix/install-nix-action@v31
      - if: steps.lane.outputs.docs-only == 'true'
        uses: pnpm/action-setup@v6
      - if: steps.lane.outputs.docs-only == 'true'
        name: Commit graph of main for repo-checks
        run: |
          unshallow=$([ "$(git rev-parse --is-shallow-repository)" = true ] && echo --unshallow || true)
          git fetch --no-tags --filter=tree:0 $unshallow origin +refs/heads/main:refs/remotes/origin/main
      - if: steps.lane.outputs.docs-only == 'true'
        name: Docs gates (format, single plan)
        run: |
          s=0
          pnpm --config.verify-deps-before-run=false format:check || s=1
          pnpm --config.verify-deps-before-run=false gate:repo || s=1
          exit $s

  check:
    needs: lane
    if: needs.lane.outputs.docs-only != 'true' && (github.event_name != 'push' || github.event.head_commit.author.username != 'github-actions[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: "true"
      OXLINT_FORMAT: github
      TSGO_FORMAT: github-actions
      TURBO_RUN_SUMMARY: "true"
    steps:
      - name: Record the job start
        run: echo "JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - name: dprint from the flake
        run: echo "$(nix build --no-link --print-out-paths .#dprint)/bin" >> "$GITHUB_PATH"
      - uses: ./.github/actions/released-tarballs
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Commit graph of main for repo-checks
        run: |
          unshallow=$([ "$(git rev-parse --is-shallow-repository)" = true ] && echo --unshallow || true)
          git fetch --no-tags --filter=tree:0 $unshallow origin +refs/heads/main:refs/remotes/origin/main
      - id: base
        name: Base commit (first parent of the checked-out commit; merge-base with main on dispatch)
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            base=$(git merge-base HEAD origin/main)
          else
            base=$(git cat-file -p HEAD | awk '$1 == "parent" { print $2; exit }')
          fi
          echo "sha=$base" >> "$GITHUB_OUTPUT"
      # The base commit's entry is restored on its own, with no restore-keys: `actions/cache` searches
      # this ref before main, so one step with a prefix fallback would return this ref's newest (stale)
      # entry ahead of main's exact base entry. The prefix fallback runs only when the base has none.
      - id: restore-base
        name: Restore the Turbo cache of the base commit
        if: inputs.cache != 'cold'
        uses: actions/cache/restore@v6
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-dist-${{ steps.base.outputs.sha }}
      - id: restore-newest
        name: Restore the newest Turbo cache this ref can read
        if: inputs.cache != 'cold' && steps.restore-base.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v6
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-dist-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-dist-
      - id: own-entry
        name: Look up this commit's own Turbo cache entry
        if: inputs.cache != 'cold'
        uses: actions/cache/restore@v6
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-dist-${{ github.sha }}
          lookup-only: true
      - id: planted
        name: pnpm gate:repo fails on a change that adds two plans
        run: |
          planted=$(
            export GIT_INDEX_FILE="$RUNNER_TEMP/planted.index"
            git read-tree HEAD
            for name in planted-a planted-b; do
              blob=$(printf '# %s\n' "$name" | git hash-object -w --stdin)
              git update-index --add --cacheinfo "100644,$blob,docs/plans/$name-plan.md"
            done
            git -c user.name=plant -c user.email=plant@localhost commit-tree "$(git write-tree)" -p HEAD -m 'plant: two plans'
          )
          status=0
          pnpm gate:repo --head "$planted" || status=$?
          test "$status" -eq 1 || { echo "::error::pnpm gate:repo must exit 1 on two planted plans, got $status" >&2; exit 1; }
      - name: Repo scripts tests
        run: ./bin/deno test --config=scripts/deno.json scripts/
      # Root package.json `check:ci` is the one definition. Never re-enumerate its steps here.
      - id: gate
        name: Gate
        run: pnpm check:ci
      - id: verdict
        name: Verdict of the Gate
        if: always()
        env:
          CANCELLED: ${{ job.status == 'cancelled' }}
          COLD: ${{ inputs.cache == 'cold' }}
          GATE: ${{ steps.gate.outcome }}
          PLANTED: ${{ steps.planted.outcome }}
          BASE_SHA: ${{ steps.base.outputs.sha }}
          BASE_KEY: ${{ steps.restore-base.outputs.cache-matched-key }}
          NEWEST_KEY: ${{ steps.restore-newest.outputs.cache-matched-key }}
          OWN_HIT: ${{ steps.own-entry.outputs.cache-hit }}
        run: |
          shopt -s nullglob
          runs=(.turbo/runs/*.json)
          missed=0 failed="" missing=""
          if [ "$GATE" = success ] || [ "$GATE" = failure ]; then
            summary=$(node scripts/turbo-summary.ts "${runs[@]}") || true
            while IFS='=' read -r field value; do
              case "$field" in
                missed) missed=$value ;;
                failed) failed=$value ;;
                missing) missing=$value ;;
              esac
            done <<< "$summary"
          fi

          if [ "$CANCELLED" = true ]; then
            reason=CANCELLED next="The run was cancelled before the Gate finished; re-run the job."
          elif [ -n "$missing" ]; then
            reason=GATE_VERDICT_UNPARSEABLE next="Turbo's run summary lacks ${missing}, so this job cannot tell cached, missed or failed tasks apart. Turbo's summary format changed: update scripts/turbo-summary.ts and its test, or pin turbo back. Reproduce with: TURBO_RUN_SUMMARY=true pnpm gate:tasks && node scripts/turbo-summary.ts .turbo/runs/*.json"
          elif [ "$GATE" = success ] && [ "$PLANTED" = success ]; then
            reason=GATE_OK next=""
          elif [ -n "$failed" ]; then
            reason=TURBO_TASK_FAILED next="Turbo task failed: ${failed}. Reproduce with: pnpm exec turbo run ${failed}"
          elif [ "$PLANTED" = failure ]; then
            reason=GATE_NON_TURBO_FAILED next="pnpm gate:repo accepted two planted plans: the single-plan check no longer fails. Read the step 'pnpm gate:repo fails on a change that adds two plans'."
          elif [ "$GATE" = failure ]; then
            reason=GATE_NON_TURBO_FAILED next="A Gate script outside Turbo failed: format:check (fix with pnpm format), lint:conventions, or gate:repo. Reproduce with: pnpm check:ci"
          else
            reason=CHECK_SETUP_FAILED next="A setup step failed before the Gate ran; open the first failed step of this job."
          fi

          if [ "$COLD" = true ]; then
            restored="not restored (\`cache: cold\` dispatch)"
          elif [ -n "$BASE_KEY" ]; then
            restored="\`$BASE_KEY\` (base commit)"
          elif [ -n "$NEWEST_KEY" ]; then
            restored="\`$NEWEST_KEY\` (newest readable; base commit \`${BASE_SHA:0:9}\` had no entry)"
          else
            restored="nothing (no entry readable)"
          fi

          save=false
          if [ "$reason" != GATE_OK ]; then
            saving="skipped ($reason)"
          elif [ "$COLD" = true ]; then
            saving="skipped (\`cache: cold\` dispatch)"
          elif [ "$OWN_HIT" = true ]; then
            saving="skipped (this commit's entry exists)"
          elif [ "$missed" = 0 ]; then
            saving="skipped (every task was cached)"
          else
            save=true saving="attempted ($missed tasks were not cached)"
          fi

          {
            echo "reason=$reason"
            echo "next=$next"
            echo "save=$save"
            echo "details=- Turbo cache restored: $restored; save: $saving"
          } >> "$GITHUB_OUTPUT"
          [ "$reason" != GATE_VERDICT_UNPARSEABLE ]
      - name: Drop restored cache entries this run did not use
        if: success() && steps.verdict.outputs.save == 'true'
        run: |
          jq -r '.tasks[].hash' .turbo/runs/*.json | sort -u > "$RUNNER_TEMP/keep"
          find .turbo/cache -maxdepth 1 -type f -printf '%f\n' \
            | while read -r file; do grep -qxF "${file%%[-.]*}" "$RUNNER_TEMP/keep" || rm -f ".turbo/cache/$file"; done
      - name: Save the Turbo cache
        if: success() && steps.verdict.outputs.save == 'true'
        uses: actions/cache/save@v6
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-dist-${{ github.sha }}
      - name: Job report
        if: always()
        uses: ./.github/actions/job-report
        with:
          status: ${{ job.status }}
          reason: ${{ steps.verdict.outputs.reason }}
          next-action: ${{ steps.verdict.outputs.next }}
          started-at: ${{ env.JOB_STARTED_AT }}
          turbo-runs: .turbo/runs
          details: ${{ steps.verdict.outputs.details }}

  # The only job that may delete caches. It deletes by cache id, never by key, so main's entry and a
  # pull request's entry under the same key are never confused. Main keeps its newest three entries
  # (the bases of recent PRs), every other ref its newest one, and a closed pull request none.
  cache-sweep:
    needs: check
    if: ${{ !cancelled() && github.event_name == 'push' && github.event.head_commit.author.username != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
      pull-requests: read
    steps:
      - name: Record the job start
        run: echo "JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/actions/job-report
      - id: sweep
        name: Sweep Turbo cache entries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh cache list --repo "$GITHUB_REPOSITORY" --key turbo- --sort created_at --order desc --limit 1000 \
            --json id,ref,sizeInBytes --jq '.[] | [.id, .ref, .sizeInBytes] | @tsv' > "$RUNNER_TEMP/caches.tsv"
          declare -A seen state
          kept=0 kept_bytes=0 deleted=0 deleted_bytes=0 failed=0
          while IFS=$'\t' read -r id ref bytes; do
            case "$ref" in
              refs/heads/main) limit=3 ;;
              refs/pull/*/merge)
                pr=${ref#refs/pull/} pr=${pr%/merge}
                if [ -z "${state[$pr]:-}" ]; then
                  state[$pr]=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pr" --jq .state) || {
                    state[$pr]=unknown
                    echo "::warning title=SWEEP_PR_STATE_UNKNOWN::Could not read the state of PR #$pr; its Turbo entries are kept this run."
                  }
                fi
                case "${state[$pr]}" in
                  open) limit=1 ;;
                  unknown) limit=$((1 << 30)) ;;
                  *) limit=0 ;;
                esac ;;
              *) limit=1 ;;
            esac
            n=$(( ${seen[$ref]:-0} + 1 ))
            seen[$ref]=$n
            if (( n <= limit )); then
              kept=$(( kept + 1 )) kept_bytes=$(( kept_bytes + bytes ))
            elif gh cache delete --repo "$GITHUB_REPOSITORY" "$id"; then
              deleted=$(( deleted + 1 )) deleted_bytes=$(( deleted_bytes + bytes ))
            else
              failed=$(( failed + 1 ))
              echo "::warning title=SWEEP_DELETE_FAILED::Could not delete Turbo cache entry $id ($ref); the next sweep retries it."
            fi
          done < "$RUNNER_TEMP/caches.tsv"
          echo "details=- Turbo entries kept: $kept ($(( kept_bytes / 1000000 )) MB); deleted: $deleted ($(( deleted_bytes / 1000000 )) MB); failed to delete: $failed" >> "$GITHUB_OUTPUT"
      - name: Job report
        if: always()
        uses: ./.github/actions/job-report
        with:
          status: ${{ job.status }}
          reason: ${{ job.status == 'success' && 'SWEEP_OK' || job.status == 'cancelled' && 'CANCELLED' || 'SWEEP_FAILED' }}
          next-action: "Re-run the cache-sweep job; list the entries with: gh cache list --key turbo- --limit 100"
          started-at: ${{ env.JOB_STARTED_AT }}
          details: ${{ steps.sweep.outputs.details }}

  e2e:
    needs: lane
    if: needs.lane.outputs.docs-only != 'true' && (github.event_name != 'push' || github.event.head_commit.author.username != 'github-actions[bot]')
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: lifecycle
            files: tests/enterprise-mutation-lifecycle.e2e.test.ts
          - shard: sabotage
            files: tests/enterprise-monorepo-sabotage.e2e.test.ts
          - shard: svelte-composite
            files: tests/svelte-app.e2e.test.ts tests/enterprise-composite-checker.e2e.test.ts
          - shard: rest-1
            files: --shard=1/2
          - shard: rest-2
            files: --shard=2/2
    name: e2e (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true"
      RUNTIME: docker
      OTEL_ENABLED: "true"
      OTEL_SERVICE_NAME: stryker-js-ci
      OTEL_EXPORTER_OTLP_ENDPOINT: http://127.0.0.1:4318
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: cachix/install-nix-action@v31
      - uses: ./.github/actions/released-tarballs
      - run: pnpm install --frozen-lockfile
      - name: deno from the flake
        run: echo "$(nix build --no-link --print-out-paths .#deno)/bin" >> "$GITHUB_PATH"
      - name: Install process-compose (pinned)
        run: |
          curl -sSfL -o /tmp/pc.tar.gz https://github.com/F1bonacc1/process-compose/releases/download/v1.122.0/process-compose_linux_amd64.tar.gz
          echo '9b6dbc38324c0b0481f1cd1dd828ffdc78117129ec797678f4bf8c4023311281  /tmp/pc.tar.gz' | sha256sum -c -
          sudo tar xzf /tmp/pc.tar.gz -C /usr/local/bin process-compose
      - name: Start LGTM (blocks until probe-ready)
        run: |
          echo "TRACE_WINDOW_START=$(date +%s)" >> "$GITHUB_ENV"
          pnpm lgtm:up
      # `timeout` turns a hang into a failure of this step, so the lane reports its own exit status and
      # the `if: always()` telemetry steps run inside the job's 30-minute budget. A cancelled job also
      # runs `if: always()` steps, but only within GitHub's 5-minute cancellation window.
      - name: E2E lane
        id: lane
        env:
          STRYKER_E2E_BAKE_RECORD: ${{ runner.temp }}/e2e-bake.json
        run: >-
          timeout --signal=TERM --kill-after=10s 1200 pnpm test:e2e -- ${{ matrix.files }}
          ${{ startsWith(matrix.shard, 'rest') && '--exclude=tests/enterprise-mutation-lifecycle.e2e.test.ts --exclude=tests/enterprise-monorepo-sabotage.e2e.test.ts --exclude=tests/svelte-app.e2e.test.ts --exclude=tests/enterprise-composite-checker.e2e.test.ts' || '' }}
      - name: Bake report
        if: always()
        env:
          RECORD: ${{ runner.temp }}/e2e-bake.json
          LANE: ${{ steps.lane.outcome }}
        run: |
          if [ -f "$RECORD" ]; then
            jq -r .summary "$RECORD" >> "$GITHUB_STEP_SUMMARY"
            jq -r '.annotations[]' "$RECORD"
          elif [ "$LANE" = success ]; then
            echo "::warning title=E2E_BAKE_NO_RECORD::The E2E lane passed but global setup wrote no bake record, so this leg reports no bake state. Next: check that STRYKER_E2E_BAKE_RECORD reaches vitest (turbo.json test:e2e passThroughEnv)."
          else
            printf "### Fixture bake\n\n\`E2E_BAKE_NO_RECORD\`: the lane ended (%s) before global setup recorded the bake.\n" "$LANE" >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=E2E_BAKE_NO_RECORD::The E2E lane ended ($LANE) before global setup recorded the fixture bake. Next: read the global setup error in the E2E lane log; the e2e-telemetry artifact holds the e2e.setup spans."
          fi
      - name: Export telemetry
        if: always()
        run: ./test/e2e/scripts/export-traces.ts
      - name: Container logs on failure
        if: failure()
        continue-on-error: true
        run: |
          mkdir -p e2e-telemetry/containers
          for c in $(docker ps -aq); do
            name=$(docker inspect --format '{{.Name}}' "$c" | sed 's|^/||')
            docker logs "$c" > "e2e-telemetry/containers/${name}.log" 2>&1 || true
          done
      - name: Package telemetry
        if: always()
        run: tar czf e2e-telemetry.tar.gz e2e-telemetry
      - name: Upload telemetry artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-telemetry-${{ github.run_id }}-${{ matrix.shard }}
          path: e2e-telemetry.tar.gz
          retention-days: 7
          if-no-files-found: error

  checker-parity-changes:
    if: github.event_name != 'push' || github.event.head_commit.author.username != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      run: ${{ steps.changes.outputs.run }}
      mode: ${{ steps.changes.outputs.mode }}
      base: ${{ steps.changes.outputs.base }}
      legs: ${{ steps.plan.outputs.legs }}
      shards: ${{ steps.plan.outputs.shards }}
    permissions:
      actions: read
      contents: read
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: base
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = push ]; then
            base="$BEFORE"
            git cat-file -e "$base^{commit}" 2>/dev/null || base=$(git rev-parse HEAD^1)
          else
            git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
            base=$(git merge-base HEAD origin/main)
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: cachix/install-nix-action@v31
      - uses: ./.github/actions/released-tarballs
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo build --filter @systemfsoftware/stryker-checker-parity
      - id: changes
        env:
          BASE: ${{ steps.base.outputs.base }}
        run: |
          set -o pipefail
          node test/checker-parity/dist/main.mjs trigger --base "$BASE" | tee -a "$GITHUB_OUTPUT"
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
      - name: Restore the cost table
        id: costs-restore
        if: steps.changes.outputs.mode == 'full'
        uses: actions/cache/restore@v6
        with:
          path: .checker-parity-costs
          key: checker-parity-costs-v3-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: checker-parity-costs-v3-
      - name: Fold every recent run's leg measurements into the cost table
        if: steps.changes.outputs.mode == 'full'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          table=.checker-parity-costs/costs.json
          work=.checker-parity-bootstrap
          mkdir -p "$work" .checker-parity-costs
          restored=""
          if [ -f "$table" ]; then
            restored=" $(jq -r '.runs | map(tostring) | join(" ")' "$table") "
          fi
          runs_api="repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?status=completed"
          candidates=$(
            {
              gh api "$runs_api&event=workflow_dispatch&per_page=20" --jq '.workflow_runs[].id'
              gh api "$runs_api&event=push&branch=main&per_page=10" --jq '.workflow_runs[].id'
              gh api "$runs_api&branch=$BRANCH&per_page=20" --jq '.workflow_runs[].id'
            } | sort -n -u
          )
          folded=""
          skipped=""
          for run in $candidates; do
            if [ "$run" = "$GITHUB_RUN_ID" ]; then
              continue
            fi
            case "$restored" in *" $run "*) continue ;; esac
            artifacts=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/artifacts?per_page=100" \
              --jq "[.artifacts[] | select((.name | test(\"^checker-parity-$run-[0-9]+$\")) and (.expired | not)) | .id] | .[]")
            if [ -z "$artifacts" ]; then
              continue
            fi
            for artifact in $artifacts; do
              mkdir -p "$work/$run/$artifact"
              gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact/zip" > "$work/$run/$artifact.zip"
              unzip -q -o "$work/$run/$artifact.zip" -d "$work/$run/$artifact"
              rm "$work/$run/$artifact.zip"
            done
            base=()
            if [ -f "$table" ]; then
              base=(--base "$table")
            fi
            if node test/checker-parity/dist/main.mjs costs "${base[@]}" --run-id "$run" --out "$table.next" "$work/$run"; then
              mv "$table.next" "$table"
              folded="$folded $run"
            else
              skipped="$skipped $run"
              echo "::warning title=checker-parity cost-run-skipped::The leg artifacts of run $run did not decode as checker-parity lines, so the cost table leaves that run out. Next action: none if the run predates the current line schema; otherwise inspect its shard files."
            fi
          done
          {
            echo "### checker-parity cost table"
            echo
            echo "Restored with runs:${restored:- none}"
            echo
            echo "Folded now (every attempt's legs, newest measurement per file wins):${folded:- none}"
            echo
            echo "Skipped:${skipped:- none}"
            echo
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Plan the legs
        id: plan
        env:
          MODE: ${{ steps.changes.outputs.mode }}
        run: |
          set -euo pipefail
          if [ "$MODE" != "full" ]; then
            echo "legs=[1,2,3,4,5,6]" >> "$GITHUB_OUTPUT"
            echo "shards=6" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          costs=()
          if [ -f .checker-parity-costs/costs.json ]; then
            costs=(--costs .checker-parity-costs/costs.json)
          fi
          node test/checker-parity/dist/main.mjs plan \
            --deadline "$PARITY_DEADLINE" \
            --block-mutants 16 \
            "${costs[@]}" \
            --out checker-parity-plan.json | tee -a "$GITHUB_OUTPUT"
      - name: Save the folded cost table
        if: steps.changes.outputs.mode == 'full' && hashFiles('.checker-parity-costs/costs.json') != ''
        uses: actions/cache/save@v6
        with:
          path: .checker-parity-costs
          key: checker-parity-costs-v3-${{ github.run_id }}-${{ github.run_attempt }}-plan
      - name: Upload the plan
        if: steps.changes.outputs.mode == 'full'
        uses: actions/upload-artifact@v7
        with:
          name: checker-parity-plan-${{ github.run_id }}
          path: checker-parity-plan.json
          retention-days: 14

  checker-parity:
    needs: checker-parity-changes
    if: needs.checker-parity-changes.outputs.run == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.checker-parity-changes.outputs.legs) }}
    name: checker-parity (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: ${{ needs.checker-parity-changes.outputs.mode == 'full' && 45 || 8 }}
    env:
      CI: "true"
      SHARDS: ${{ needs.checker-parity-changes.outputs.shards }}
      MODE: ${{ needs.checker-parity-changes.outputs.mode }}
      BASE: ${{ needs.checker-parity-changes.outputs.base }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: cachix/install-nix-action@v31
      - uses: ./.github/actions/released-tarballs
      - run: pnpm install --frozen-lockfile
      - name: Build the branch checker, instrumenter and driver
        run: >-
          pnpm turbo build
          --filter @systemfsoftware/stryker-js-typescript-checker
          --filter @systemfsoftware/stryker-checker-parity
      - name: Build main's checker at the base commit
        run: |
          git worktree add "$RUNNER_TEMP/main-side" "$BASE"
          cd "$RUNNER_TEMP/main-side"
          if cmp -s flake.lock "$GITHUB_WORKSPACE/flake.lock"; then
            cp -r "$GITHUB_WORKSPACE/.sfs-deps" .sfs-deps
          else
            mkdir .sfs-deps
            cp "$(nix build --no-link --print-out-paths .#stryker-published)"/*.tgz .sfs-deps/
            chmod u+w .sfs-deps/*.tgz
          fi
          pnpm install --frozen-lockfile
          pnpm turbo build --filter @systemfsoftware/stryker-js-typescript-checker
      - name: Restore verdict cache
        id: restore
        uses: actions/cache/restore@v6
        with:
          path: .checker-parity-cache
          key: checker-parity-leg-${{ github.run_id }}-${{ matrix.shard }}-${{ github.run_attempt }}
          restore-keys: |
            checker-parity-leg-${{ github.run_id }}-${{ matrix.shard }}-
            checker-parity-verdicts-
      - name: Report a cold verdict cache
        if: steps.restore.outputs.cache-matched-key == ''
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          echo "::warning title=checker-parity cache-miss (${SHARD})::No verdict cache matched prefix checker-parity-verdicts-, so every file in this leg is checked cold. Next action: none if this is the first run of the lane; otherwise check that the previous run's 'Save verdict cache' step ran."
          echo "Verdict cache: miss (code \`cache-miss\`), leg $SHARD starts cold." >> "$GITHUB_STEP_SUMMARY"
      - name: Download the plan
        if: env.MODE == 'full'
        uses: actions/download-artifact@v7
        with:
          name: checker-parity-plan-${{ github.run_id }}
          path: checker-parity-plan
      - name: Run both checkers over the shard
        id: run
        timeout-minutes: ${{ env.MODE == 'full' && 40 || 5 }}
        env:
          BUDGET: ${{ env.MODE == 'full' && 2340 || 270 }}
          DEADLINE: ${{ env.MODE == 'full' && env.PARITY_DEADLINE || 210 }}
        run: |
          set +e
          plan=()
          if [ "$MODE" = "full" ]; then
            plan=(--plan checker-parity-plan/checker-parity-plan.json)
          fi
          timeout --signal=TERM --kill-after=10s "$BUDGET" \
            node test/checker-parity/dist/main.mjs run \
            --scope "$MODE" \
            --base "$BASE" \
            --settings test/checker-parity/pr-scope.json \
            "${plan[@]}" \
            --deadline "$DEADLINE" \
            --main-worker "$RUNNER_TEMP/main-side/packages/stryker-js-typescript-checker/dist/main.mjs" \
            --branch-worker "$GITHUB_WORKSPACE/packages/stryker-js-typescript-checker/dist/main.mjs" \
            --shard "${{ matrix.shard }}/$SHARDS" \
            --cache .checker-parity-cache \
            --out checker-parity-out
          code=$?
          echo "exit=$code" >> "$GITHUB_OUTPUT"
          exit "$code"
      - name: Point a failed shard at its artifact
        if: failure()
        env:
          SHARD: ${{ matrix.shard }}
          EXIT: ${{ steps.run.outputs.exit }}
          ARTIFACT: checker-parity-${{ github.run_id }}-${{ matrix.shard }}
        run: |
          if [ "$EXIT" = 2 ]; then
            exit 0
          elif [ "$EXIT" = 124 ] || [ "$EXIT" = 137 ] || [ -z "$EXIT" ]; then
            code=shard-timeout
            next="The driver's own deadline did not stop the leg before the step budget, which is a driver bug. Verdicts of every finished batch are in the saved cache; rerun the failed legs and they resume from it. The last 'checker-parity heartbeat' line in this step's log names the side, project, file and batch that was running; scope-$SHARD.json (LegStarted) lists the leg's projects."
          else
            code=shard-failed
            next="Read lines with _tag ProjectBootFailed or TelemetryMissing in shard-$SHARD.ndjson; they name the project and the reason."
          fi
          echo "::error title=checker-parity shard $SHARD failed ($code)::Artifact $ARTIFACT, files shard-$SHARD.ndjson and scope-$SHARD.json. Next action: $next"
          {
            echo "### checker-parity shard $SHARD failed (\`$code\`)"
            echo "Artifact \`$ARTIFACT\`, files \`shard-$SHARD.ndjson\` and \`scope-$SHARD.json\`. $next"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Save verdict cache
        if: always() && steps.restore.outcome == 'success'
        uses: actions/cache/save@v6
        with:
          path: .checker-parity-cache
          key: checker-parity-leg-${{ github.run_id }}-${{ matrix.shard }}-${{ github.run_attempt }}
      - name: Upload the verdict cache
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: checker-parity-verdicts-${{ github.run_id }}-${{ matrix.shard }}
          path: .checker-parity-cache
          retention-days: 7
          if-no-files-found: ignore
      - name: Upload shard results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: checker-parity-${{ github.run_id }}-${{ matrix.shard }}
          path: checker-parity-out
          retention-days: 14
          if-no-files-found: error

  checker-parity-report:
    needs: [checker-parity-changes, checker-parity]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: "true"
    steps:
      - name: Change detection finished
        if: contains(fromJSON('["failure", "cancelled"]'), needs.checker-parity-changes.result)
        env:
          RESULT: ${{ needs.checker-parity-changes.result }}
        run: |
          echo "::error title=checker-parity change detection ${RESULT}::The checker-parity-changes job ended with ${RESULT}, so no shard ran (code shard-incomplete). Read that job's log, then rerun the workflow."
          echo "### checker-parity: change detection ended with \`$RESULT\`" >> "$GITHUB_STEP_SUMMARY"
          exit 1
      - name: Not applicable
        if: needs.checker-parity-changes.result == 'success' && needs.checker-parity-changes.outputs.run != 'true'
        run: |
          echo "checker-parity: not-applicable (no change reaches the checker, instrumenter, tsgo or driver inputs)."
          echo "### checker-parity: pass (\`not-applicable\`): no change reaches the checker, instrumenter, tsgo or driver inputs." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v7
        if: needs.checker-parity-changes.outputs.run == 'true'
      - uses: pnpm/action-setup@v6
        if: needs.checker-parity-changes.outputs.run == 'true'
      - uses: actions/setup-node@v7
        if: needs.checker-parity-changes.outputs.run == 'true'
        with:
          node-version: 24
          cache: pnpm
      - uses: cachix/install-nix-action@v31
        if: needs.checker-parity-changes.outputs.run == 'true'
      - uses: ./.github/actions/released-tarballs
        if: needs.checker-parity-changes.outputs.run == 'true'
      - if: needs.checker-parity-changes.outputs.run == 'true'
        run: pnpm install --frozen-lockfile
      - if: needs.checker-parity-changes.outputs.run == 'true'
        run: pnpm turbo build --filter @systemfsoftware/stryker-checker-parity
      - name: Download every leg
        if: needs.checker-parity-changes.outputs.run == 'true'
        uses: actions/download-artifact@v7
        with:
          pattern: checker-parity-${{ github.run_id }}-*
          path: checker-parity-shards
      - name: Restore the cost table
        id: costs-restore
        if: always() && needs.checker-parity-changes.outputs.run == 'true'
        uses: actions/cache/restore@v6
        with:
          path: .checker-parity-costs
          key: checker-parity-costs-v3-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            checker-parity-costs-v3-${{ github.run_id }}-
            checker-parity-costs-v3-
      - name: Merge this run's measurements into the cost table
        if: always() && needs.checker-parity-changes.outputs.run == 'true'
        run: |
          set -euo pipefail
          mkdir -p .checker-parity-costs .checker-parity-cache
          base=()
          if [ -f .checker-parity-costs/costs.json ]; then
            base=(--base .checker-parity-costs/costs.json)
          fi
          node test/checker-parity/dist/main.mjs costs "${base[@]}" --out checker-parity-costs.json checker-parity-shards
          cp checker-parity-costs.json .checker-parity-costs/costs.json
      - name: Save the cost table
        if: always() && needs.checker-parity-changes.outputs.run == 'true'
        uses: actions/cache/save@v6
        with:
          path: .checker-parity-costs
          key: checker-parity-costs-v3-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Collect the verdict caches
        if: always() && needs.checker-parity-changes.outputs.run == 'true'
        uses: actions/download-artifact@v7
        with:
          pattern: checker-parity-verdicts-${{ github.run_id }}-*
          path: .checker-parity-cache
          merge-multiple: true
      - name: Save the merged verdict cache
        if: always() && needs.checker-parity-changes.outputs.run == 'true'
        uses: actions/cache/save@v6
        with:
          path: .checker-parity-cache
          key: checker-parity-verdicts-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Every shard finished
        if: needs.checker-parity-changes.outputs.run == 'true' && needs.checker-parity.result != 'success'
        env:
          RESULT: ${{ needs.checker-parity.result }}
          PATTERN: checker-parity-${{ github.run_id }}-*
        run: |
          echo "::error title=checker-parity shards ${RESULT}::A shard did not finish (code shard-incomplete). Read the failed checker-parity (k) leg's annotation (leg-deadline, shard-timeout or shard-failed), then artifact ${PATTERN}, files shard-<k>.ndjson and scope-<k>.json. Rerun failed jobs: checked batches resume from the verdict cache."
          {
            echo "### checker-parity: shards ended with \`$RESULT\`"
            echo "Reason code \`shard-incomplete\`. Artifacts \`$PATTERN\`, files \`shard-<k>.ndjson\` and \`scope-<k>.json\` per shard."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1
      - name: Compare main and branch verdicts
        if: needs.checker-parity-changes.outputs.run == 'true'
        run: >-
          node test/checker-parity/dist/main.mjs compare
          --shards ${{ needs.checker-parity-changes.outputs.shards }}
          --summary checker-parity-summary.json
          checker-parity-shards
      - name: Upload summary
        if: always() && needs.checker-parity-changes.outputs.run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: checker-parity-summary-${{ github.run_id }}
          path: |
            checker-parity-summary.json
            checker-parity-costs.json
          retention-days: 14
          if-no-files-found: warn
