# Cost: about 256 runner-min/day (231-459) for the nightly scheduled Mutation run, on the
# three-project corpus. The instrumenter and the HTML reporter add a share the first
# nightly run measures.
# Run shape: one scheduled run a day (17 3 * * *) plus any manual dispatch, never a push
# or a pull request. A full run holds the scoring lane, the kill-matrix lane and the drop
# audit; `lane: kill-matrix` holds the last two.
# Per lane, job-minutes read from the jobs API on 2026-10-13. Scoring lane, scheduled
# `--full`: runs 38384850859 (47.7), 38239240750 (43.5), 38130563737 (44.5) and
# 38042987222 (161.5), median 46.1 (43.5-161.5). Kill-matrix lane over 15 completed main
# push runs 38290483095 (2026-10-12T18:22Z) through 38456457178 (2026-10-13T19:38Z):
# median 209.0 job-min (187.2-297.0), wall time median 34.7 min. Drop audit: 0.97 job-min
# (run 38344422811) and 0.67 (run 38366579884), with the Mutation build cache restored.
# Rejected counterfactual, the push trigger this change removes: on main 115
# first-parent commits from 2026-10-06T20:00Z to 2026-10-13T20:00Z (16.4 a day), and the
# 12 completed push runs of 2026-10-13 took 4,006 job-min; push runs per day 2026-10-06 to
# 2026-10-12 were 19, 14, 11, 14, 20, 2 and 11.
# Reason: the #333 review run 20261013-170535-66c6722d, finding #6 "Mutation heavy lane's
# cost changed with no runner-minutes header" (pack rule ci-wall-clock/heavy-lanes-state-their-daily-minutes),
# was rejected only because mutation.yml was outside #333's diff.
name: Mutation

on:
  workflow_dispatch:
    inputs:
      full:
        description: Re-verify every mutant instead of reusing the incremental cache
        type: boolean
        default: false
      lane:
        description: Which lane to run. `kill-matrix` runs the full kill-matrix lane and the drop audit of its matrix; `all` also runs the scoring lane.
        type: choice
        options:
          - all
          - kill-matrix
        default: all
  schedule:
    - cron: "17 3 * * *"

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  TARGET_SECONDS: 200
  MAX_SHARDS: 20
  PROJECTS: packages/stryker-js,packages/stryker-js-typescript-checker,packages/stryker-js-vitest-runner,packages/stryker-js-instrumenter,packages/stryker-js-html-reporter
  PUBLISHED_CLI: ${{ github.workspace }}/packages/stryker-js/node_modules/.bin/stryker
  PLAN: plan.json
  INCREMENTAL_REPORTS: |
    packages/stryker-js/reports/stryker-incremental.json
    packages/stryker-js-typescript-checker/reports/stryker-incremental.json
    packages/stryker-js-vitest-runner/reports/stryker-incremental.json
    packages/stryker-js-instrumenter/reports/stryker-incremental.json
    packages/stryker-js-html-reporter/reports/stryker-incremental.json
  BUDGET_BASELINE: .stryker/budget-baseline.json

jobs:
  plan:
    name: plan · shards from the incremental cost record
    if: ${{ github.event.inputs.lane != 'kill-matrix' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
      incrementalKey: ${{ steps.cache-key.outputs.key }}
    steps:
      - uses: actions/checkout@v7

      - id: cache-key
        name: Content key of the incremental report
        env:
          KEY: mutation-incremental-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', 'packages/**/src/**', 'packages/**/stryker.config.ts') }}
        run: echo "key=$KEY" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: ./.github/actions/released-tarballs
      - run: pnpm install --frozen-lockfile

      - name: Restore the incremental report of the last run
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.INCREMENTAL_REPORTS }}
          key: ${{ steps.cache-key.outputs.key }}
          restore-keys: |
            mutation-incremental-

      - id: plan
        name: Plan
        env:
          FULL: ${{ (github.event_name == 'schedule' || github.event.inputs.full == 'true') && '--full' || '' }}
        run: |
          $PUBLISHED_CLI plan \
            --target-seconds "$TARGET_SECONDS" \
            --max-shards "$MAX_SHARDS" \
            --projects "$PROJECTS" \
            --out "$PLAN" \
            $FULL
          echo "matrix=$(jq -c '.matrix' "$PLAN")" >> "$GITHUB_OUTPUT"
          echo "count=$(jq '.matrix.include | length' "$PLAN")" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: shard-plan
          path: ${{ env.PLAN }}
          retention-days: 30

  build:
    name: build · once for every shard
    if: ${{ github.event.inputs.lane != 'kill-matrix' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      key: ${{ steps.key.outputs.key }}
    steps:
      - uses: actions/checkout@v7

      # Hashed before install, so node_modules and dist never enter the key. Turbo re-hashes
      # every task's inputs on restore, so a stale or partial cache only costs a rebuild.
      - id: key
        name: Content key of the build
        env:
          KEY: mutation-build-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json', 'packages/**') }}
        run: echo "key=$KEY" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: ./.github/actions/released-tarballs
      - run: pnpm install --frozen-lockfile

      - id: restore
        name: Restore the build cache of the last run
        uses: actions/cache/restore@v6
        with:
          path: .turbo/cache
          key: ${{ steps.key.outputs.key }}
          restore-keys: |
            mutation-build-${{ runner.os }}-

      - name: Build every mutated project
        run: |
          mapfile -t filters < <(tr ',' '\n' <<< "$PROJECTS" | sed 's|^|--filter=./|')
          pnpm exec turbo run build --output-logs=errors-only --log-order=stream --summarize "${filters[@]}"

      - name: Drop restored cache entries this build did not use
        if: steps.restore.outputs.cache-hit != 'true'
        run: |
          jq -r '.tasks[].hash' .turbo/runs/*.json | sort -u > /tmp/keep
          find .turbo/cache -maxdepth 1 -type f -printf '%f\n' \
            | while read -r file; do grep -qxF "${file%%[-.]*}" /tmp/keep || rm -f ".turbo/cache/$file"; done

      - name: Save the build cache
        if: steps.restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: .turbo/cache
          key: ${{ steps.key.outputs.key }}

  mutation:
    name: mutation · shard ${{ matrix.shard }}
    needs: [plan, build]
    if: ${{ github.event.inputs.lane != 'kill-matrix' && needs.plan.result == 'success' && needs.build.result == 'success' && needs.plan.outputs.count != '0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: ./.github/actions/released-tarballs
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: shard-plan

      - name: Restore the build every shard shares
        uses: actions/cache/restore@v6
        with:
          path: .turbo/cache
          key: ${{ needs.build.outputs.key }}

      - name: Build the projects this shard mutates
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          mapfile -t filters < <(
            jq -r --arg shard "$SHARD" \
              '.shards[] | select("\(.index)/\(.count)" == $shard) | .projects[].project' "$PLAN" \
              | sort -u | sed 's|^|--filter=./|'
          )
          pnpm exec turbo run build --output-logs=errors-only --log-order=stream "${filters[@]}"

      - name: Restore the incremental report of the last run
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.INCREMENTAL_REPORTS }}
          key: ${{ needs.plan.outputs.incrementalKey }}
          restore-keys: |
            mutation-incremental-

      - id: shard
        name: Name the shard output
        env:
          SHARD: ${{ matrix.shard }}
        run: echo "slug=${SHARD//\//of}" >> "$GITHUB_OUTPUT"

      - name: Mutation
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          $PUBLISHED_CLI run \
            --plan "$PLAN" \
            --shard "$SHARD" \
            --out "reports/shards/${{ steps.shard.outputs.slug }}"

      - id: upload
        name: Upload the shard report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: mutation-shard-${{ steps.shard.outputs.slug }}
          path: reports/shards
          if-no-files-found: error
          retention-days: 30
          overwrite: true
      - name: Wait before retrying the upload
        if: ${{ !cancelled() && steps.upload.outcome == 'failure' }}
        run: sleep 30
      - id: upload-retry
        name: Upload the shard report (retry)
        if: ${{ !cancelled() && steps.upload.outcome == 'failure' }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: mutation-shard-${{ steps.shard.outputs.slug }}
          path: reports/shards
          if-no-files-found: error
          retention-days: 30
          overwrite: true
      - name: Wait before the last upload attempt
        if: ${{ !cancelled() && steps.upload-retry.outcome == 'failure' }}
        run: sleep 90
      - name: Upload the shard report (last attempt)
        if: ${{ !cancelled() && steps.upload-retry.outcome == 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: mutation-shard-${{ steps.shard.outputs.slug }}
          path: reports/shards
          if-no-files-found: error
          retention-days: 30
          overwrite: true

  report:
    name: Mutation report
    needs: [plan, mutation]
    if: ${{ github.event.inputs.lane != 'kill-matrix' && !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.count != '0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: ./.github/actions/released-tarballs
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: shard-plan
      - name: Download every shard report into shards/<k>of<n>
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: mutation-shard-*
          path: shards
          merge-multiple: true

      - name: Restore the incremental report of the last run
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.INCREMENTAL_REPORTS }}
          key: ${{ needs.plan.outputs.incrementalKey }}
          restore-keys: |
            mutation-incremental-

      - name: Merge the shards
        run: |
          shards=()
          while read -r shard; do
            shards+=("shards/${shard//\//of}")
          done < <(jq -r '.shards[] | "\(.index)/\(.count)"' "$PLAN")
          $PUBLISHED_CLI merge \
            --plan "$PLAN" \
            "${shards[@]}" \
            --out reports/mutation

      - uses: actions/upload-artifact@v7
        with:
          name: mutation-report-${{ github.run_number }}
          path: reports/mutation/*
          retention-days: 14
          overwrite: true

      - name: Seed each project's incremental report from its own merged report
        run: |
          for dir in ${PROJECTS//,/ }; do
            merged="reports/mutation/$dir/stryker-incremental.json"
            if [ ! -f "$merged" ]; then
              echo "::error title=No merged incremental report::$merged is missing, so $dir cannot reuse a verdict next run"
              exit 1
            fi
            mkdir -p "$dir/reports"
            cp "$merged" "$dir/reports/stryker-incremental.json"
          done

      - uses: actions/cache/save@v6
        if: ${{ hashFiles('packages/stryker-js/reports/stryker-incremental.json') != '' }}
        with:
          path: ${{ env.INCREMENTAL_REPORTS }}
          key: ${{ needs.plan.outputs.incrementalKey }}

      # Pinned CLI (stryker-published 9e81669b8) exit codes: VerdictFail 1, ConfigError 2
      # (packages/stryker-js-plugin-interface/src/ExitClass.schema.ts:11-16). With no --baseline,
      # BudgetExceeded is the only exit 1 (run-request.cell.ts:472,492) and the only message matching
      # $budget (packages/stryker-js/src/budget-gate.workflow.ts:45).
      - id: gate
        name: Gate the merged report
        run: |
          if [ ! -f "$BUDGET_BASELINE" ]; then
            echo "::notice title=No budget baseline::$BUDGET_BASELINE is absent; writing it from this run and uploading it for a maintainer to commit"
            $PUBLISHED_CLI gate --budget-baseline "$BUDGET_BASELINE" --update-budget-baseline
            echo "bootstrapped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "bootstrapped=false" >> "$GITHUB_OUTPUT"
          set +e
          $PUBLISHED_CLI gate --budget-baseline "$BUDGET_BASELINE" 2>&1 | tee "$RUNNER_TEMP/gate.log"
          status=${PIPESTATUS[0]}
          set -e
          [ "$status" -ne 0 ] || exit 0
          # A CLI that rewords this message stops matching, so its exit 1 fails the job instead of warning.
          budget='run took ([0-9.]+)s, over the ([0-9.]+)s budget'
          if [ "$status" -ne 1 ] || ! [[ "$(cat "$RUNNER_TEMP/gate.log")" =~ $budget ]]; then
            exit "$status"
          fi
          actual=${BASH_REMATCH[1]} allowed=${BASH_REMATCH[2]}
          {
            echo "### Mutation budget exceeded (code \`BUDGET_EXCEEDED\`)"
            echo "The run took ${actual}s against the ${allowed}s budget (\`$BUDGET_BASELINE\`). This budget is the workflow's only verdict, and it is report-only per the owner's ruling, so the job passes."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::warning title=BUDGET_EXCEEDED::Mutation took ${actual}s against the ${allowed}s budget in $BUDGET_BASELINE. Next action: compare executed vs reused mutants per shard against the previous main Mutation run. A lockfile edit that drops reuse is fixed by #303 once it is released. Update the baseline only with numbers showing new mutated code at an unchanged per-mutant cost."

      - uses: actions/upload-artifact@v7
        if: ${{ steps.gate.outputs.bootstrapped == 'true' }}
        with:
          name: budget-baseline-${{ github.run_number }}
          path: ${{ env.BUDGET_BASELINE }}
          if-no-files-found: error
          retention-days: 14
          overwrite: true

      - name: Delete per-shard artifacts once the report merged
        if: success()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
            --jq '.artifacts[] | select(.name | startswith("mutation-shard-")) | .id' \
          | while read -r id; do gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id"; done

  kill-matrix:
    name: Kill matrix
    permissions:
      contents: read
    uses: ./.github/workflows/kill-matrix.yml

  drop-audit:
    name: drop-audit · audit this run's kill matrix
    needs: [kill-matrix]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      MATRIX_DIR: kill-matrix
      MATRIX_ARTIFACT: kill-matrix-${{ github.run_number }}
      AUDIT_OUT: reports/audit.json
    steps:
      - id: start
        name: Record the start time
        run: echo "at=$(date +%s)" >> "$GITHUB_OUTPUT"

      - id: checkout
        uses: actions/checkout@v7

      - id: build-key
        name: Key of the build cache, hashed before install as the build job hashes it
        env:
          KEY: mutation-build-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json', 'packages/**') }}
        run: echo "key=$KEY" >> "$GITHUB_OUTPUT"

      - id: pnpm
        uses: pnpm/action-setup@v6
      - id: node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - id: tarballs
        uses: ./.github/actions/released-tarballs
      - id: install
        run: pnpm install --frozen-lockfile

      - id: restore
        name: Restore the build the build job cached
        uses: actions/cache/restore@v6
        with:
          path: .turbo/cache
          key: ${{ steps.build-key.outputs.key }}
          restore-keys: |
            mutation-build-${{ runner.os }}-

      - id: download
        name: Download this run's kill matrix (not a verdict; matrix-check judges its outcome)
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.MATRIX_ARTIFACT }}
          path: ${{ env.MATRIX_DIR }}

      - id: matrix-check
        name: Check the kill matrix covers the corpus
        shell: bash
        env:
          KILL_MATRIX: ${{ needs.kill-matrix.result }}
          DOWNLOAD: ${{ steps.download.outcome }}
        run: |
          set -euo pipefail
          if [ "$KILL_MATRIX" != success ]; then
            echo 'reason=MATRIX_MISSING' >> "$GITHUB_OUTPUT"
            exit 1
          fi
          if [ "$DOWNLOAD" != success ] || [ ! -d "$MATRIX_DIR" ]; then
            echo 'reason=MATRIX_NOT_DOWNLOADED' >> "$GITHUB_OUTPUT"
            exit 1
          fi
          absent=''
          while read -r project; do
            [ -n "$project" ] || continue
            [ -f "$MATRIX_DIR/$project/stryker-incremental.json" ] || absent="${absent:+$absent,}$project"
          done < <(tr ',' '\n' <<< "$PROJECTS")
          if [ -n "$absent" ]; then
            { echo 'reason=MATRIX_INCOMPLETE'; echo "absent=$absent"; } >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - id: build
        name: Build the CLI and the audited projects
        run: |
          mapfile -t filters < <(tr ',' '\n' <<< "packages/stryker-js,$PROJECTS" | sort -u | sed 's|^|--filter=./|')
          pnpm exec turbo run build --output-logs=errors-only --log-order=stream "${filters[@]}"

      - id: audit
        name: stryker audit
        shell: bash
        env:
          NO_COLOR: "1"
        run: |
          set -uo pipefail
          node packages/stryker-js/dist/main.mjs audit --matrix "$MATRIX_DIR" --projects "$PROJECTS" --out "$AUDIT_OUT" 2>&1 | tee audit.txt
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - id: audit-summary
        name: Copy the audit's output to the summary (report only)
        if: ${{ !cancelled() && steps.audit.outcome != 'skipped' && hashFiles('audit.txt') != '' }}
        run: |
          {
            echo "#### stryker audit against \`$MATRIX_ARTIFACT\` of this run"
            echo
            echo '```text'
            cat audit.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - id: upload
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && hashFiles(env.AUDIT_OUT) != '' }}
        with:
          name: drop-audit-${{ github.run_number }}
          path: ${{ env.AUDIT_OUT }}
          retention-days: 14
          overwrite: true

      - id: verdict
        name: Verdict of the drop audit
        if: always()
        shell: bash
        env:
          STEPS: ${{ toJSON(steps) }}
          KILL_MATRIX: ${{ needs.kill-matrix.result }}
          RUN: ${{ github.run_id }}
        run: |
          set -euo pipefail
          fetch="gh run download $RUN -R $GITHUB_REPOSITORY -n $MATRIX_ARTIFACT -D $MATRIX_DIR"
          filters=$(tr ',' '\n' <<< "packages/stryker-js,$PROJECTS" | sort -u | sed 's|^|--filter=./|' | paste -sd' ')
          build="pnpm install --frozen-lockfile && pnpm exec turbo run build $filters"
          audit="node packages/stryker-js/dist/main.mjs audit --matrix $MATRIX_DIR --projects $PROJECTS --out $AUDIT_OUT"
          dispatch='gh workflow run mutation.yml --ref main -f lane=kill-matrix'
          rerun="gh run rerun $RUN -R $GITHUB_REPOSITORY --failed"
          first='' outcome=''
          for id in checkout build-key pnpm node tarballs install restore matrix-check build audit audit-summary upload; do
            o=$(jq -r --arg id "$id" '.[$id].outcome // "skipped"' <<< "$STEPS")
            if [ "$o" = failure ] || [ "$o" = cancelled ]; then first=$id outcome=$o; break; fi
          done
          if [ -z "$first" ]; then
            reason=DROP_AUDIT_OK next=''
          elif [ "$outcome" = cancelled ]; then
            reason=DROP_AUDIT_TIMED_OUT next="Step $first was cancelled: the run was cancelled or the job hit its 60-minute backstop. Next action: $rerun."
          else
            case "$first" in
              install)
                reason=DROP_AUDIT_INSTALL_FAILED next="Step install failed. Reproduce with: pnpm install --frozen-lockfile" ;;
              matrix-check)
                reason=$(jq -r '.["matrix-check"].outputs.reason // "MATRIX_MISSING"' <<< "$STEPS")
                absent=$(jq -r '.["matrix-check"].outputs.absent // ""' <<< "$STEPS")
                case "$reason" in
                  MATRIX_MISSING)
                    next="The kill-matrix lane of this run ended '$KILL_MATRIX', so it published no $MATRIX_ARTIFACT. Next action: fix the cause its failed job's annotation names, then $dispatch. Reproduce with: $fetch" ;;
                  MATRIX_NOT_DOWNLOADED)
                    next="The kill-matrix lane passed but $MATRIX_ARTIFACT did not download. Either its plan job planned no shard (count 0: the corpus has no mutant to grade, so collect was skipped and published nothing) or the download failed. Reproduce with: $fetch (it succeeds only if the artifact exists). Next action: if it succeeds, $rerun; if it finds no artifact, read the kill-matrix plan job's plan.json artifact and fix the mutate globs that select nothing." ;;
                  *)
                    next="$MATRIX_ARTIFACT has no kill matrix for $absent, so it does not cover the corpus. Next action: make both projects defaults in .github/workflows/kill-matrix.yml equal mutation.yml's PROJECTS, then $dispatch. Reproduce with: $fetch && for p in ${PROJECTS//,/ }; do test -f $MATRIX_DIR/\$p/stryker-incremental.json || echo \"absent: \$p\"; done" ;;
                esac ;;
              build)
                reason=DROP_AUDIT_BUILD_FAILED next="A build task of the audited projects failed. Reproduce with: $build" ;;
              audit)
                status=$(jq -r '.audit.outputs.status // ""' <<< "$STEPS")
                if [ "$status" = 2 ]; then
                  reason=DROP_AUDIT_REFUSED next="stryker audit exited 2: it refused its input, and its refusal line is in the audit output above. Next action: fix the kill matrix or the projects list it names. Reproduce with: $fetch && $build && $audit"
                else
                  reason=DROP_AUDIT_FAILED next="stryker audit exited ${status:-unknown}: a Fail line in the audit output above (and artifact drop-audit-$GITHUB_RUN_NUMBER) names a dropped mutant whose dominator has a killer the dropped mutant lacks. Reproduce with: $fetch && $build && $audit"
                fi ;;
              upload)
                reason=DROP_AUDIT_UPLOAD_FAILED next="The audit passed but drop-audit-$GITHUB_RUN_NUMBER did not upload. Next action: $rerun." ;;
              *)
                reason=DROP_AUDIT_UNCLASSIFIED next="Setup step $first failed; it is outside this job's reason table. Next action: open step $first of this job, then $rerun." ;;
            esac
          fi
          {
            echo "reason=$reason"
            echo "next<<NEXT_EOF"
            echo "$next"
            echo 'NEXT_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Report the drop audit
        if: always()
        uses: ./.github/actions/job-report
        with:
          status: ${{ job.status }}
          reason: ${{ steps.verdict.outputs.reason }}
          next-action: ${{ steps.verdict.outputs.next }}
          started-at: ${{ steps.start.outputs.at }}
