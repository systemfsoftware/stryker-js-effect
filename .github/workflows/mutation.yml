name: Mutation

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - ".changeset/**"
      - "docs/**"
  workflow_dispatch:
    inputs:
      full:
        description: Re-verify every mutant instead of reusing the incremental cache
        type: boolean
        default: false
  schedule:
    - cron: "17 3 * * *"

concurrency:
  group: ${{ github.event.head_commit.author.username == 'github-actions[bot]' && format('mutation-release-{0}', github.run_id) || format('mutation-{0}', github.ref) }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  TARGET_SECONDS: 200
  MAX_SHARDS: 20
  PROJECTS: packages/stryker-js,packages/stryker-js-typescript-checker,packages/stryker-js-vitest-runner,test/e2e-core
  PUBLISHED_CLI: ${{ github.workspace }}/packages/stryker-js/node_modules/.bin/stryker
  PLAN: plan.json
  INCREMENTAL_REPORTS: |
    packages/stryker-js/reports/stryker-incremental.json
    packages/stryker-js-typescript-checker/reports/stryker-incremental.json
    packages/stryker-js-vitest-runner/reports/stryker-incremental.json
    test/e2e-core/reports/stryker-incremental.json
  BUDGET_BASELINE: .stryker/budget-baseline.json

jobs:
  plan:
    name: plan · shards from the incremental cost record
    if: github.event_name != 'push' || github.event.head_commit.author.username != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
      incrementalKey: ${{ steps.cache-key.outputs.key }}
    steps:
      - uses: actions/checkout@v7

      - id: cache-key
        name: Content key of the incremental report
        env:
          KEY: mutation-incremental-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', 'packages/**/src/**', 'packages/**/stryker.config.ts', 'test/e2e-core/src/**', 'test/e2e-core/stryker.config.ts') }}
        run: echo "key=$KEY" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: ./.github/actions/released-tarballs
      - run: pnpm install --frozen-lockfile

      - name: Restore the incremental report of the last run
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.INCREMENTAL_REPORTS }}
          key: ${{ steps.cache-key.outputs.key }}
          restore-keys: |
            mutation-incremental-

      - id: plan
        name: Plan
        env:
          FULL: ${{ (github.event_name == 'schedule' || github.event.inputs.full == 'true') && '--full' || '' }}
        run: |
          $PUBLISHED_CLI plan \
            --target-seconds "$TARGET_SECONDS" \
            --max-shards "$MAX_SHARDS" \
            --projects "$PROJECTS" \
            --out "$PLAN" \
            $FULL
          echo "matrix=$(jq -c '.matrix' "$PLAN")" >> "$GITHUB_OUTPUT"
          echo "count=$(jq '.matrix.include | length' "$PLAN")" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: shard-plan
          path: ${{ env.PLAN }}
          retention-days: 1

  build:
    name: build · once for every shard
    if: github.event_name != 'push' || github.event.head_commit.author.username != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      key: ${{ steps.key.outputs.key }}
    steps:
      - uses: actions/checkout@v7

      # Hashed before install, so node_modules and dist never enter the key. Turbo re-hashes
      # every task's inputs on restore, so a stale or partial cache only costs a rebuild.
      - id: key
        name: Content key of the build
        env:
          KEY: mutation-build-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json', 'packages/**', 'test/e2e-core/**') }}
        run: echo "key=$KEY" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: ./.github/actions/released-tarballs
      - run: pnpm install --frozen-lockfile

      - id: restore
        name: Restore the build cache of the last run
        uses: actions/cache/restore@v6
        with:
          path: .turbo/cache
          key: ${{ steps.key.outputs.key }}
          restore-keys: |
            mutation-build-${{ runner.os }}-

      - name: Build every mutated project
        run: |
          mapfile -t filters < <(tr ',' '\n' <<< "$PROJECTS" | sed 's|^|--filter=./|')
          pnpm exec turbo run build --output-logs=errors-only --log-order=stream --summarize "${filters[@]}"

      - name: Drop restored cache entries this build did not use
        if: steps.restore.outputs.cache-hit != 'true'
        run: |
          jq -r '.tasks[].hash' .turbo/runs/*.json | sort -u > /tmp/keep
          find .turbo/cache -maxdepth 1 -type f -printf '%f\n' \
            | while read -r file; do grep -qxF "${file%%[-.]*}" /tmp/keep || rm -f ".turbo/cache/$file"; done

      - name: Save the build cache
        if: steps.restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: .turbo/cache
          key: ${{ steps.key.outputs.key }}

  mutation:
    name: mutation · shard ${{ matrix.shard }}
    needs: [plan, build]
    if: ${{ needs.plan.result == 'success' && needs.build.result == 'success' && needs.plan.outputs.count != '0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: ./.github/actions/released-tarballs
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: shard-plan

      - name: Restore the build every shard shares
        uses: actions/cache/restore@v6
        with:
          path: .turbo/cache
          key: ${{ needs.build.outputs.key }}

      - name: Build the projects this shard mutates
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          mapfile -t filters < <(
            jq -r --arg shard "$SHARD" \
              '.shards[] | select("\(.index)/\(.count)" == $shard) | .projects[].project' "$PLAN" \
              | sort -u | sed 's|^|--filter=./|'
          )
          pnpm exec turbo run build --output-logs=errors-only --log-order=stream "${filters[@]}"

      - name: Restore the incremental report of the last run
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.INCREMENTAL_REPORTS }}
          key: ${{ needs.plan.outputs.incrementalKey }}
          restore-keys: |
            mutation-incremental-

      - id: shard
        name: Name the shard output
        env:
          SHARD: ${{ matrix.shard }}
        run: echo "slug=${SHARD//\//of}" >> "$GITHUB_OUTPUT"

      - name: Mutation
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          $PUBLISHED_CLI run \
            --plan "$PLAN" \
            --shard "$SHARD" \
            --out "reports/shards/${{ steps.shard.outputs.slug }}"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mutation-shard-${{ steps.shard.outputs.slug }}
          path: reports/shards/${{ steps.shard.outputs.slug }}
          if-no-files-found: error
          retention-days: 1

  report:
    name: Mutation report
    needs: [plan, mutation]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.count != '0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: ./.github/actions/released-tarballs
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: shard-plan
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: mutation-shard-*
          path: shards

      - name: Restore the incremental report of the last run
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.INCREMENTAL_REPORTS }}
          key: ${{ needs.plan.outputs.incrementalKey }}
          restore-keys: |
            mutation-incremental-

      - name: Merge the shards
        run: |
          shards=()
          while read -r shard; do
            shards+=("shards/mutation-shard-${shard//\//of}")
          done < <(jq -r '.shards[] | "\(.index)/\(.count)"' "$PLAN")
          $PUBLISHED_CLI merge \
            --plan "$PLAN" \
            "${shards[@]}" \
            --out reports/mutation

      - uses: actions/upload-artifact@v7
        with:
          name: mutation-report-${{ github.run_number }}
          path: reports/mutation/*
          retention-days: 14

      - name: Seed each project's incremental report from its own merged report
        run: |
          for dir in ${PROJECTS//,/ }; do
            merged="reports/mutation/$dir/stryker-incremental.json"
            if [ ! -f "$merged" ]; then
              echo "::error title=No merged incremental report::$merged is missing, so $dir cannot reuse a verdict next run"
              exit 1
            fi
            mkdir -p "$dir/reports"
            cp "$merged" "$dir/reports/stryker-incremental.json"
          done

      - uses: actions/cache/save@v6
        if: ${{ hashFiles('packages/stryker-js/reports/stryker-incremental.json') != '' }}
        with:
          path: ${{ env.INCREMENTAL_REPORTS }}
          key: ${{ needs.plan.outputs.incrementalKey }}

      - id: gate
        name: Gate the merged report
        run: |
          if [ ! -f "$BUDGET_BASELINE" ]; then
            echo "::notice title=No budget baseline::$BUDGET_BASELINE is absent; writing it from this run and uploading it for a maintainer to commit"
            $PUBLISHED_CLI gate --budget-baseline "$BUDGET_BASELINE" --update-budget-baseline
            echo "bootstrapped=true" >> "$GITHUB_OUTPUT"
          else
            $PUBLISHED_CLI gate --budget-baseline "$BUDGET_BASELINE"
            echo "bootstrapped=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/upload-artifact@v7
        if: ${{ steps.gate.outputs.bootstrapped == 'true' }}
        with:
          name: budget-baseline-${{ github.run_number }}
          path: ${{ env.BUDGET_BASELINE }}
          if-no-files-found: error
          retention-days: 14

      - name: Delete per-shard artifacts
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
            --jq '.artifacts[] | select(.name | startswith("mutation-shard-")) | .id' \
          | while read -r id; do gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id"; done
