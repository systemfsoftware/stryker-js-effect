name: Mutation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TIMINGS: deno run --config=scripts/deno.json --allow-read --allow-write --allow-env scripts/mutation-timings.ts
  MUTATION_JOB: deno run --config=scripts/deno.json --allow-read --allow-write --allow-env --allow-run=timeout scripts/mutation-job.ts
  TARGET_SECONDS: 900

jobs:
  plan:
    name: plan · mutation jobs from recorded timings
    if: github.event_name != 'push' || github.event.head_commit.author.username != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      jobs: ${{ steps.plan.outputs.jobs }}
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
      - name: Latest timing record from main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .timings/previous
          id=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=mutation-timings&per_page=100" \
            --jq '[.artifacts[] | select(.expired | not) | select(.workflow_run.head_branch == "main")][0].id // empty') || id=
          if [ -n "$id" ] && gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" > .timings/previous.zip; then
            unzip -o -q .timings/previous.zip -d .timings/previous || true
          fi
          ls .timings/previous
      - id: plan
        run: $TIMINGS plan --target "$TARGET_SECONDS" --max-jobs 20 --unknown-seconds "$TARGET_SECONDS" --record .timings/previous/mutation-timings.json
      - uses: actions/upload-artifact@v7
        with:
          name: mutation-timings-previous
          path: .timings/previous/
          if-no-files-found: ignore
          retention-days: 1

  preflight:
    name: preflight · one dry run per package
    needs: plan
    if: ${{ needs.plan.result == 'success' && needs.plan.outputs.jobs != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OTEL_ENABLED: "true"
      OTEL_SERVICE_NAME: stryker-js-mutation
      OTEL_EXPORTER_OTLP_ENDPOINT: http://127.0.0.1:4318
      OUT_DIR: mutation-telemetry
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: denoland/setup-deno@v2
      - name: Build
        run: pnpm exec turbo run build --output-logs=errors-only --log-order=stream ${{ join(fromJSON(needs.plan.outputs.jobs).*.filters, ' ') }}

      - uses: actions/cache/restore@v6
        with:
          path: .stryker-incremental
          key: stryker-incremental-${{ github.run_id }}
          restore-keys: |
            stryker-incremental-
      - name: Place incremental files
        run: if [ -d .stryker-incremental ]; then cp -a .stryker-incremental/. .; fi

      - name: Install process-compose (pinned)
        run: |
          curl -sSfL -o /tmp/pc.tar.gz https://github.com/F1bonacc1/process-compose/releases/download/v1.122.0/process-compose_linux_amd64.tar.gz
          echo '9b6dbc38324c0b0481f1cd1dd828ffdc78117129ec797678f4bf8c4023311281  /tmp/pc.tar.gz' | sha256sum -c -
          sudo tar xzf /tmp/pc.tar.gz -C /usr/local/bin process-compose
      - name: Start LGTM (blocks until probe-ready)
        run: |
          echo "TRACE_WINDOW_START=$(date +%s)" >> "$GITHUB_ENV"
          pnpm lgtm:up

      - name: Preflight
        env:
          JOBS: ${{ needs.plan.outputs.jobs }}
        run: $MUTATION_JOB preflight --cap-seconds "$TARGET_SECONDS"

      - uses: actions/upload-artifact@v7
        with:
          name: mutation-preflight
          path: preflight/
          if-no-files-found: ignore
          retention-days: 1
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: mutation-preflight-evidence
          path: preflight-evidence/
          if-no-files-found: ignore
          retention-days: 30

      - name: Export telemetry
        if: always()
        continue-on-error: true
        run: ./test/e2e/scripts/export-traces.ts
      - name: Package telemetry
        if: always()
        run: if [ -d mutation-telemetry ]; then tar czf mutation-telemetry.tar.gz mutation-telemetry; fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mutation-telemetry-${{ github.run_id }}-preflight
          path: mutation-telemetry.tar.gz
          if-no-files-found: ignore
          retention-days: 30

  mutation:
    name: mutation · ${{ matrix.job.name }}
    needs: [plan, preflight]
    if: ${{ needs.preflight.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      OTEL_ENABLED: "true"
      OTEL_SERVICE_NAME: stryker-js-mutation
      OTEL_EXPORTER_OTLP_ENDPOINT: http://127.0.0.1:4318
      OUT_DIR: mutation-telemetry
    strategy:
      fail-fast: false
      matrix:
        job: ${{ fromJSON(needs.plan.outputs.jobs) }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: denoland/setup-deno@v2
      - name: Build
        run: pnpm exec turbo run build --output-logs=errors-only --log-order=stream ${{ matrix.job.filters }}

      - uses: actions/cache/restore@v6
        with:
          path: .stryker-incremental
          key: stryker-incremental-${{ github.run_id }}
          restore-keys: |
            stryker-incremental-
      - name: Place incremental files
        run: if [ -d .stryker-incremental ]; then cp -a .stryker-incremental/. .; fi
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: mutation-preflight
          path: .

      - name: Install process-compose (pinned)
        run: |
          curl -sSfL -o /tmp/pc.tar.gz https://github.com/F1bonacc1/process-compose/releases/download/v1.122.0/process-compose_linux_amd64.tar.gz
          echo '9b6dbc38324c0b0481f1cd1dd828ffdc78117129ec797678f4bf8c4023311281  /tmp/pc.tar.gz' | sha256sum -c -
          sudo tar xzf /tmp/pc.tar.gz -C /usr/local/bin process-compose
      - name: Start LGTM (blocks until probe-ready)
        run: |
          echo "TRACE_WINDOW_START=$(date +%s)" >> "$GITHUB_ENV"
          pnpm lgtm:up

      - name: Mutation
        env:
          JOB: ${{ toJSON(matrix.job) }}
        run: $MUTATION_JOB run --cap-seconds "$((TARGET_SECONDS * 2))" --budget-seconds "$((TARGET_SECONDS * 4))"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mutation-timings-part-${{ matrix.job.id }}
          path: .timings/${{ matrix.job.id }}.json
          if-no-files-found: ignore
          retention-days: 1
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mutation-incremental-${{ matrix.job.id }}
          path: incremental/
          if-no-files-found: ignore
          retention-days: 1
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mutation-part-${{ matrix.job.id }}
          path: mutation-parts/
          if-no-files-found: ignore
          retention-days: 30

      - name: Export telemetry
        if: always()
        continue-on-error: true
        run: ./test/e2e/scripts/export-traces.ts
      - name: Package telemetry
        if: always()
        run: if [ -d mutation-telemetry ]; then tar czf mutation-telemetry.tar.gz mutation-telemetry; fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mutation-telemetry-${{ github.run_id }}-${{ matrix.job.id }}
          path: mutation-telemetry.tar.gz
          if-no-files-found: ignore
          retention-days: 30

  timings:
    name: record mutation timings
    needs: [plan, mutation]
    if: ${{ always() && needs.plan.result == 'success' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
      - uses: actions/download-artifact@v8
        with:
          pattern: mutation-timings-part-*
          path: .timings/parts
          merge-multiple: true
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: mutation-timings-previous
          path: .timings/previous
      - name: Merge this run into the record
        run: $TIMINGS merge --target "$TARGET_SECONDS" --previous .timings/previous/mutation-timings.json --parts .timings/parts --out .timings/mutation-timings.json --sha "$GITHUB_SHA"
      - uses: actions/upload-artifact@v7
        with:
          name: mutation-timings
          path: .timings/mutation-timings.json
          retention-days: 30

  report:
    name: Mutation report
    needs: [plan, preflight, mutation]
    if: ${{ !cancelled() && needs.preflight.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: write
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: denoland/setup-deno@v2

      - uses: actions/cache/restore@v6
        with:
          path: .stryker-incremental
          key: stryker-incremental-${{ github.run_id }}
          restore-keys: |
            stryker-incremental-
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: mutation-incremental-*
          path: .stryker-incremental
          merge-multiple: true
      - uses: actions/cache/save@v6
        if: ${{ github.event_name != 'pull_request' && hashFiles('.stryker-incremental/**') != '' }}
        with:
          path: .stryker-incremental
          key: stryker-incremental-${{ github.run_id }}

      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          path: mutation-parts
          pattern: mutation-part-*
      - name: Fold shard parts into one part per package
        env:
          JOBS: ${{ needs.plan.outputs.jobs }}
        run: $MUTATION_JOB combine --parts mutation-parts --out mutation-combined
      - name: Merge
        run: |
          pnpm --filter @systemfsoftware/stryker-js exec stryker merge-reports \
            --parts "$GITHUB_WORKSPACE/mutation-combined" \
            --out "$GITHUB_WORKSPACE/mutation-merged" \
            --packages "$PACKAGES"
      - uses: actions/upload-artifact@v7
        with:
          name: mutation-report-${{ github.run_number }}
          path: mutation-merged/*
          retention-days: 14

      - name: Merge SARIF
        if: always()
        run: $MUTATION_JOB sarif --parts mutation-parts --out mutation-sarif/mutation.sarif
      - uses: github/codeql-action/upload-sarif@v4
        if: ${{ always() && hashFiles('mutation-sarif/mutation.sarif') != '' }}
        with:
          sarif_file: mutation-sarif/mutation.sarif
          category: mutation

      - name: Survivor baseline
        if: ${{ env.MUTATION_REPORT_COMPLETE == 'true' && github.ref == 'refs/heads/main' }}
        run: |
          mkdir -p mutation-gate/reports/mutation
          cp mutation-merged/mutation-report.json mutation-gate/reports/mutation/mutation.json
          cd mutation-gate
          "$GITHUB_WORKSPACE/packages/stryker-js/node_modules/.bin/stryker" gate --baseline mutation-survivor-baseline.json --update-baseline
      - uses: actions/upload-artifact@v7
        if: ${{ env.MUTATION_REPORT_COMPLETE == 'true' && github.ref == 'refs/heads/main' }}
        with:
          name: mutation-survivor-baseline
          path: mutation-gate/mutation-survivor-baseline.json
          retention-days: 90

      - name: Survivor baseline from main
        if: ${{ github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p mutation-gate/reports/mutation
          id=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=mutation-survivor-baseline&per_page=100" \
            --jq '[.artifacts[] | select(.expired | not) | select(.workflow_run.head_branch == "main")][0].id // empty') || id=
          if [ -n "$id" ] && gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" > mutation-gate/baseline.zip; then
            unzip -o -q mutation-gate/baseline.zip -d mutation-gate
          fi
      - name: Gate new survivors
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          if [ ! -f mutation-gate/mutation-survivor-baseline.json ]; then
            echo "::warning title=Mutation gate skipped::main has published no survivor baseline yet, so this run cannot tell a new survivor from an accepted one"
            exit 0
          fi
          cp mutation-merged/mutation-report.json mutation-gate/reports/mutation/mutation.json
          cd mutation-gate
          "$GITHUB_WORKSPACE/packages/stryker-js/node_modules/.bin/stryker" gate --baseline mutation-survivor-baseline.json

      - name: Delete per-job artifacts
        if: ${{ always() && needs.mutation.result == 'success' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
            --jq '.artifacts[] | select(.name | startswith("mutation-part-") or startswith("mutation-incremental-")) | .id' \
          | while read -r id; do gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id"; done
