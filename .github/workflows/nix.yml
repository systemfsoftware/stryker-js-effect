name: Nix

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lane:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      docs-only: ${{ steps.lane.outputs.docs-only }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - id: lane
        uses: ./.github/actions/change-lane

  build:
    needs: lane
    if: needs.lane.outputs.docs-only != 'true'
    name: flake outputs · ${{ matrix.system }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-latest
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - name: Workspace tarballs rebuild bit-for-bit
        run: |
          nix build .#packages.${{ matrix.system }}.workspace-tarballs
          nix build --rebuild .#packages.${{ matrix.system }}.workspace-tarballs
