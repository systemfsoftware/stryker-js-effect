# The release flow is the single definition in
# systemfsoftware/pnpm-release-management/.github/workflows/release.yml. This
# caller only supplies the trigger and the permissions; the reusable derives
# the phase from repository state, opens the version PR, and on a push that
# leaves untagged versions it tags each one and cuts its GitHub Release. tools-ref
# pins the toolchain revision — a back-edge to the shared tools, consumed per the
# documented contract. There is no npm publish: distribution is this repo's Nix
# flake outputs consumed from a git ref, and the <pkg>@vX.Y.Z git tag is the
# durable record that a version shipped
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    uses: systemfsoftware/pnpm-release-management/.github/workflows/release.yml@main
    with:
      tools-ref: main
