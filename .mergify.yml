# Mergify: policy lives in systemfsoftware/.github (.mergify.yml). This file only names this repo's CI checks.
# Docs-only PRs skip `check`, the flake jobs and the changeset job through the change-lane filter, so each
# of those accepts "skipped" as well as "success"; the always-running `lane` job proves CI actually ran.
extends: .github
queue_rules:
  - name: default
    # Checked on the PR itself before it enters the queue.
    queue_conditions:
      - check-success = lane
      - or:
          - check-success = check
          - check-skipped = check
      - or:
          - check-success = lint PR commits
          - check-skipped = lint PR commits
      - or:
          - check-success = check / a publishable-package change needs an intent
          - check-skipped = check / a publishable-package change needs an intent
          - check-skipped = check
      - or:
          - check-success = flake outputs · x86_64-linux
          - check-skipped = flake outputs · x86_64-linux
      - or:
          - check-success = flake outputs · aarch64-linux
          - check-skipped = flake outputs · aarch64-linux
    # Checked on Mergify's queue draft PR (mergify/merge-queue/*), i.e. CI on the PR rebased with main and any batch.
    merge_conditions:
      - check-success = lane
      - or:
          - check-success = check
          - check-skipped = check
      - or:
          - check-success = flake outputs · x86_64-linux
          - check-skipped = flake outputs · x86_64-linux
      - or:
          - check-success = flake outputs · aarch64-linux
          - check-skipped = flake outputs · aarch64-linux
